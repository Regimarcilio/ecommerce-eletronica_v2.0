<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>[PROTÓTIPO] Auth — RF-011/012/013</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>body{background:#0a0a0f;color:#fff;font-family:'Segoe UI',sans-serif}.card{background:#1a1a2e;border:1px solid #4361ee33;border-radius:16px;max-width:440px;margin:auto}.note{border-left:3px solid #f59e0b;background:#f59e0b14;padding:8px 12px;border-radius:0 8px 8px 0;font-size:.85rem}.aba{cursor:pointer;padding:8px 16px;border-radius:8px}.aba.on{background:#4361ee}</style>
</head>
<body>
<div class="container py-4">
<a href="index.html">← hub</a> <span class="badge bg-warning text-dark">PROTÓTIPO MOCKADO</span>
<div class="card p-4 mt-3">
<h3 class="text-center">TechStore</h3>
<div class="d-flex gap-2 justify-content-center mb-3"><span class="aba on" id="t1" onclick="aba('login')">Entrar</span><span class="aba" id="t2" onclick="aba('cad')">Cadastrar</span><span class="aba" id="t3" onclick="aba('rec')">Esqueci</span></div>
<div id="f-login"><input class="form-control mb-2 bg-dark text-white" placeholder="e-mail"><input class="form-control mb-2 bg-dark text-white" type="password" placeholder="senha"><button class="btn btn-primary w-100" onclick="location.href='vitrine.html'">Entrar (mock → vitrine)</button></div>
<div id="f-cad" style="display:none"><input class="form-control mb-2 bg-dark text-white" placeholder="nome"><input class="form-control mb-2 bg-dark text-white" placeholder="e-mail"><input class="form-control mb-2 bg-dark text-white" type="password" placeholder="senha mín 8"><button class="btn btn-primary w-100" onclick="location.href='vitrine.html'">Cadastrar (mock)</button><p class="small text-muted mt-2">Valida: confirmação igual, backend retorna token+refresh.</p></div>
<div id="f-rec" style="display:none"><input class="form-control mb-2 bg-dark text-white" placeholder="e-mail da conta"><button class="btn btn-secondary w-100" onclick="document.getElementById('tok').style.display='';void(0)">Enviar (resposta genérica anti-enumeração)</button><div id="tok" style="display:none" class="mt-2"><input class="form-control mb-2 bg-dark text-white" placeholder="token (dev)"><input class="form-control mb-2 bg-dark text-white" type="password" placeholder="nova senha"><button class="btn btn-secondary w-100" onclick="aba('login')">Redefinir (uso único)</button></div></div>
</div>
<div class="note mt-3" style="max-width:440px;margin:auto">Sessão real: access 15min + refresh rotativo; guards renovam; logout revoga. Fluxo → <a href="conta.html">minha conta</a>.</div>
</div>
<script>function aba(q){['login','cad','rec'].forEach((x,i)=>{document.getElementById('f-'+x).style.display=x===q?'':'none';document.getElementById('t'+(i+1)).classList.toggle('on',x===q);});}</script>
</body>
</html>
