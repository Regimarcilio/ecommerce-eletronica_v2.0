<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>[PROTÓTIPO] Carrinho — RF-006</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>body{background:#0a0a0f;color:#fff;font-family:'Segoe UI',sans-serif}.card{background:#1a1a2e;border:1px solid #4361ee33;border-radius:16px}.note{border-left:3px solid #f59e0b;background:#f59e0b14;padding:8px 12px;border-radius:0 8px 8px 0;font-size:.85rem}</style>
</head>
<body>
<div class="container py-4" style="max-width:720px">
<a href="index.html">← hub</a> <span class="badge bg-warning text-dark">PROTÓTIPO MOCKADO</span>
<h1 class="mt-2">Carrinho</h1>
<div class="note mb-3">RF-006: merge de qtd, 1–99, frete grátis &gt; R$100 senão R$20. Totais finais recalculados no servidor no pedido.</div>
<div id="lista"></div>
<div class="card p-3 mt-3"><p>Subtotal: <b id="sub">R$ 0,00</b></p><p>Frete: <b id="fre">R$ 0,00</b></p><h4>Total: <span id="tot" class="text-primary">R$ 0,00</span></h4>
<button class="btn btn-primary" onclick="location.href='checkout.html'">Finalizar compra → checkout</button>
<button class="btn btn-outline-secondary ms-2" onclick="vazio()">Simular vazio</button></div>
<h4 class="mt-3">Estado vazio</h4>
<div class="card p-4 text-center text-muted">🛒 Seu carrinho está vazio<br><a href="vitrine.html">Explorar produtos</a></div>
</div>
<script>
let cart=[{nome:'Resistor 10k',preco:4.9,qtd:2},{nome:'Camiseta Preta',preco:49.9,qtd:1}];
function render(){const sub=cart.reduce((s,i)=>s+i.preco*i.qtd,0);const fre=sub>100?0:20;
document.getElementById('lista').innerHTML=cart.map((it,i)=>`<div class="card p-2 mb-2 d-flex flex-row justify-content-between align-items-center"><span>${it.nome} × <input type="number" value="${it.qtd}" min="1" max="99" style="width:60px" onchange="cart[${i}].qtd=Math.max(1,Math.min(99,+this.value||1));render()"></span><span>R$ ${(it.preco*it.qtd).toFixed(2)} <button class="btn btn-sm btn-danger" onclick="cart.splice(${i},1);render()">✕</button></span></div>`).join('');
document.getElementById('sub').textContent='R$ '+sub.toFixed(2);document.getElementById('fre').textContent=fre===0?'Grátis':'R$ '+fre.toFixed(2);document.getElementById('tot').textContent='R$ '+(sub+fre).toFixed(2);}
function vazio(){cart=[];render();}
render();
</script>
</body>
</html>
