<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>[PROTÓTIPO] Conta — RF-014</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>body{background:#0a0a0f;color:#fff;font-family:'Segoe UI',sans-serif}.card{background:#1a1a2e;border:1px solid #4361ee33;border-radius:16px}.note{border-left:3px solid #f59e0b;background:#f59e0b14;padding:8px 12px;border-radius:0 8px 8px 0;font-size:.85rem}.tab{display:none}.tab.on{display:block}</style>
</head>
<body>
<div class="container py-4" style="max-width:760px">
<a href="index.html">← hub</a> <span class="badge bg-warning text-dark">PROTÓTIPO MOCKADO</span>
<h1 class="mt-2">Minha conta</h1>
<div class="note mb-3">Fonte da verdade: <code>GET /auth/me</code>. E-mail readonly. Senha exige atual + mín 8. Endereços no banco (CEP/UF validados).</div>
<div class="d-flex gap-2 mb-3"><button class="btn btn-outline-primary btn-sm" onclick="t('a')">Dados</button><button class="btn btn-outline-primary btn-sm" onclick="t('b')">Endereços</button><button class="btn btn-outline-primary btn-sm" onclick="t('c')">Segurança</button></div>
<div id="a" class="tab on card p-3"><input class="form-control bg-dark text-white mb-2" value="Ana Silva"><input class="form-control bg-dark text-white mb-2" value="ana@x" readonly title="imutável"><input class="form-control bg-dark text-white mb-2" value="11999999999"><button class="btn btn-primary btn-sm">Atualizar (PUT /auth/me)</button></div>
<div id="b" class="tab card p-3"><p>Av Paulista, 1000 — Bela Vista <button class="btn btn-sm btn-warning">Editar</button> <button class="btn btn-sm btn-danger">Excluir</button></p><p class="text-muted">Nenhum endereço cadastrado. (vazio)</p><button class="btn btn-primary btn-sm">+ Novo endereço (modal: CEP, logradouro, número, bairro, cidade, UF)</button></div>
<div id="c" class="tab card p-3"><input type="password" class="form-control bg-dark text-white mb-2" placeholder="Senha atual"><input type="password" class="form-control bg-dark text-white mb-2" placeholder="Nova senha"><button class="btn btn-primary btn-sm">Alterar (PUT /auth/password)</button></div>
</div>
<script>function t(id){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));document.getElementById(id).classList.add('on');}</script>
</body>
</html>
