<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Pedidos | TechStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #0a0a0f; color: #fff; font-family: 'Segoe UI', sans-serif; }
        .navbar { background: rgba(10,10,15,0.95); backdrop-filter: blur(10px); border-bottom: 1px solid #4361ee33; }
        .logo { font-size: 1.8rem; font-weight: 800; background: linear-gradient(135deg, #4361ee, #4cc9f0); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-decoration: none; }
        .order-card { background: #1a1a2e; border-radius: 16px; padding: 20px; margin-bottom: 20px; border: 1px solid #4361ee33; transition: all 0.3s; }
        .order-card:hover { transform: translateY(-3px); border-color: #4361ee; }
        .status-pendente { background: #f59e0b20; color: #f59e0b; padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; }
        .status-pago { background: #10b98120; color: #10b981; padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; }
        .status-enviado { background: #06b6d420; color: #06b6d4; padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; }
        .status-entregue { background: #20c99720; color: #20c997; padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; }
        .status-cancelado { background: #ef444420; color: #ef4444; padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; }
        .btn-primary-custom { background: linear-gradient(135deg, #4361ee, #3a0ca3); border: none; color: #fff; padding: 10px 25px; border-radius: 30px; }
        .footer { background: #0a0a0f; border-top: 1px solid #1f2937; padding: 50px 0 20px; margin-top: 50px; }
        .modal-content { background: #0d1117; color: #fff; border: 1px solid #1f2937; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg fixed-top">
        <div class="container">
            <a class="logo" href="/"><i class="fas fa-microchip"></i> TechStore</a>
            <a href="/minha-conta.html" class="btn btn-outline-light"><i class="fas fa-arrow-left"></i> Voltar</a>
        </div>
    </nav>

    <div class="container py-5" style="margin-top: 60px;">
        <h2 class="mb-4"><i class="fas fa-box text-primary"></i> Meus Pedidos</h2>
        <div id="pedidosContainer"></div>
        <nav class="d-flex justify-content-center align-items-center gap-3 mt-4" id="pedPager" style="display:none;">
            <button class="btn btn-outline-light btn-sm" id="pedPrev" onclick="mudarPaginaPed(-1)">← Anterior</button>
            <span class="text-muted small" id="pedPageInfo">Página 1</span>
            <button class="btn btn-outline-light btn-sm" id="pedNext" onclick="mudarPaginaPed(1)">Próxima →</button>
        </nav>
    </div>

    <footer class="footer">
        <div class="container text-center"><p>&copy; 2024 TechStore - Todos os direitos reservados.</p></div>
    </footer>

    <div class="modal fade" id="pedidoModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header border-0">
                    <h5 class="modal-title"><i class="fas fa-box"></i> Detalhes do Pedido</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="pedidoDetalhesBody"></div>
                <div class="modal-footer border-0">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script>
        const API = window.API_BASE;
        const token = localStorage.getItem('token');
        const user = JSON.parse(localStorage.getItem('user') || '{}');
        let pedidoModal;
        
        if (!token) window.location.href = '/auth.html';
        
        let pedPage = 1;
        const PED_LIMIT = 10;
        let pedPages = 1;

        function renderPedPager() {
            const nav = document.getElementById('pedPager');
            if (!nav) return;
            nav.style.display = pedPages > 1 ? 'flex' : 'none';
            document.getElementById('pedPageInfo').textContent = `Página ${pedPage} de ${pedPages}`;
            document.getElementById('pedPrev').disabled = pedPage <= 1;
            document.getElementById('pedNext').disabled = pedPage >= pedPages;
        }

        function mudarPaginaPed(delta) {
            const next = pedPage + delta;
            if (next < 1 || next > pedPages) return;
            pedPage = next;
            loadPedidos();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function loadPedidos() {
            try {
                const res = await fetch(`${API}/pedidos?page=${pedPage}&limit=${PED_LIMIT}`, { headers: window.getAuthHeaders() });
                if (res.status === 401) {
                    localStorage.removeItem('token'); localStorage.removeItem('user');
                    window.location.href = '/auth.html';
                    return;
                }
                const data = await res.json();
                const container = document.getElementById('pedidosContainer');

                if (data.success && data.pedidos && data.pedidos.length > 0) {
                    pedPages = data.pages || 1;
                    container.innerHTML = data.pedidos.map(p => {
                        const statusClass = getStatusClass(p.status);
                        const numero = window.escapeHtml(p.numero);
                        const total = (Number(p.total) || 0).toFixed(2);
                        const qtd = Array.isArray(p.items) ? p.items.length : 0;
                        const status = window.escapeHtml((p.status || '').toUpperCase());
                        const dataFmt = p.createdAt ? new Date(p.createdAt).toLocaleDateString() : '-';
                        return `
                            <div class="order-card">
                                <div class="d-flex justify-content-between align-items-start flex-wrap">
                                    <div>
                                        <h5>Pedido: ${numero}</h5>
                                        <p class="text-muted mb-1">Data: ${dataFmt}</p>
                                        <p class="mb-1"><strong>Total:</strong> R$ ${total}</p>
                                        <p><strong>Itens:</strong> ${qtd} produtos</p>
                                    </div>
                                    <div class="text-end">
                                        <span class="${statusClass}">${status}</span>
                                        <button class="btn btn-primary-custom btn-sm ms-3" onclick="verDetalhes('${p._id}')">
                                            <i class="fas fa-eye"></i> Ver Detalhes
                                        </button>
                                    </div>
                                </div>
                            </div>
                        `;
                    }).join('');
                    renderPedPager();
                } else if (data.success && pedPage > 1) {
                    pedPage--;
                    loadPedidos();
                    return;
                } else {
                    document.getElementById('pedPager').style.display = 'none';
                    container.innerHTML = '<div class="text-center py-5"><i class="fas fa-box-open fa-3x text-muted mb-3"></i><h4>Nenhum pedido encontrado</h4><a href="/" class="btn btn-primary-custom mt-3">Começar a comprar</a></div>';
                }
            } catch(e) { console.error(e); }
        }

        function getHeaders() {
            return { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' };
        }

        function getStatusClass(status) {
            const classes = {
                pendente: 'status-pendente',
                pago: 'status-pago',
                enviado: 'status-enviado',
                entregue: 'status-entregue',
                cancelado: 'status-cancelado'
            };
            return classes[status] || 'status-pendente';
        }

        function getPaymentLabel(pagamento) {
            if (pagamento === 'pix') return 'PIX';
            if (pagamento === 'card') return 'Cartão de Crédito';
            if (pagamento === 'boleto') return 'Boleto Bancário';
            return pagamento || '-';
        }
        
        async function verDetalhes(id) {
            try {
                const res = await fetch(API + '/pedidos/' + id, { headers: window.getAuthHeaders() });
                const data = await res.json();
                if (!data.success || !data.pedido) return;
                const p = data.pedido;
                const itensHtml = (p.items || []).map(item => `
                    <tr>
                        <td>${window.escapeHtml(item.nome ?? item.name ?? '-')}</td>
                        <td>${item.quantity}</td>
                        <td>R$ ${(item.price || 0).toFixed(2)}</td>
                        <td>R$ ${((item.price || 0) * (item.quantity || 0)).toFixed(2)}</td>
                    </tr>
                `).join('');

                document.getElementById('pedidoDetalhesBody').innerHTML = `
                    <p><strong>Número:</strong> ${window.escapeHtml(p.numero)}</p>
                    <p><strong>Status:</strong> <span class="${getStatusClass(p.status)}">${window.escapeHtml((p.status || '').toUpperCase())}</span></p>
                    <p><strong>Pagamento:</strong> ${window.escapeHtml(getPaymentLabel(p.pagamento))}</p>
                    <p><strong>Entrega:</strong> ${window.escapeHtml(p.endereco?.logradouro || '-')}, ${window.escapeHtml(p.endereco?.numero || '-')} - ${window.escapeHtml(p.endereco?.bairro || '-')}, ${window.escapeHtml(p.endereco?.cidade || '-')}/${window.escapeHtml(p.endereco?.estado || '-')}</p>
                    <div class="table-responsive">
                        <table class="table table-dark table-sm">
                            <thead><tr><th>Produto</th><th>Qtd</th><th>Preço</th><th>Total</th></tr></thead>
                            <tbody>${itensHtml}</tbody>
                        </table>
                    </div>
                    <div class="text-end">
                        <p>Subtotal: R$ ${(p.subtotal || 0).toFixed(2)}</p>
                        <p>Frete: ${p.frete === 0 ? 'Grátis' : 'R$ ' + (p.frete || 0).toFixed(2)}</p>
                        <p>Desconto: R$ ${(p.desconto || 0).toFixed(2)}</p>
                        <h5>Total: R$ ${(p.total || 0).toFixed(2)}</h5>
                    </div>
                `;
                if (!pedidoModal) pedidoModal = new bootstrap.Modal(document.getElementById('pedidoModal'));
                pedidoModal.show();
            } catch(e) { console.error(e); }
        }
        
        loadPedidos();
    </script>
</body>
</html>
