<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar | PlacaCerta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root{
  --bg:#0a0e1a; --bg2:#0e1428; --card:#131b36;
  --line:rgba(255,255,255,.09);
  --amber:#ffb224; --amber2:#ff8a00; --cyan:#38e1ff;
  --txt:#f2f5ff; --mut:#9aa4c7;
  --grad:linear-gradient(120deg,#ffb224,#ff8a00 55%,#ff5e3a);
  --r:20px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--txt);font-family:'Inter',system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 20px;
  background-image:radial-gradient(800px 420px at 85% -10%,rgba(255,138,0,.14),transparent 60%),radial-gradient(700px 500px at -10% 110%,rgba(56,225,255,.08),transparent 60%)}
h1,h2{font-family:'Space Grotesk',sans-serif}
a{color:inherit}
.shell{display:grid;grid-template-columns:1fr 1fr;max-width:920px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:26px;overflow:hidden;box-shadow:0 40px 100px rgba(0,0,0,.55)}
.side{background:linear-gradient(160deg,#141c3d,#0a0f24 70%);padding:48px 40px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
.side::after{content:'';position:absolute;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,rgba(255,138,0,.25),transparent 70%);top:-100px;right:-100px}
.brand{font-family:'Space Grotesk';font-weight:700;font-size:1.6rem;display:flex;align-items:center;gap:10px;margin-bottom:26px;position:relative;z-index:1}
.brand .bolt{width:40px;height:40px;border-radius:12px;background:var(--grad);display:grid;place-items:center;color:#1a1000}
.brand em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.side h1{font-size:2rem;letter-spacing:-.8px;margin-bottom:12px;position:relative;z-index:1}
.side h1 span{background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.side p{color:var(--mut);font-size:.93rem;margin-bottom:26px;position:relative;z-index:1}
.perks{display:flex;flex-direction:column;gap:12px;position:relative;z-index:1}
.perks div{display:flex;gap:10px;align-items:center;font-size:.88rem;color:#cdd5f0}
.perks i{color:var(--amber)}
.formbox{padding:48px 44px}
.tabs{display:flex;background:#0b1128;border:1px solid var(--line);border-radius:999px;padding:5px;margin-bottom:28px}
.tabs button{flex:1;background:none;border:none;color:var(--mut);font-weight:600;font-size:.88rem;padding:10px;border-radius:999px;cursor:pointer;font-family:'Inter'}
.tabs button.on{background:var(--grad);color:#1a1000}
.f{display:none}
.f.on{display:block}
.field{margin-bottom:16px}
.field label{display:block;font-size:.72rem;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--mut);margin-bottom:8px}
.field input{width:100%;background:#0b1128;border:1px solid var(--line);border-radius:12px;padding:13px 15px;color:var(--txt);font-size:.95rem;outline:none;font-family:'Inter'}
.field input:focus{border-color:var(--amber)}
.btn{width:100%;display:flex;justify-content:center;align-items:center;gap:8px;border:none;cursor:pointer;font-weight:700;font-size:.95rem;padding:14px;border-radius:999px;background:var(--grad);color:#1a1000;transition:.22s;font-family:'Inter'}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(255,138,0,.45)}
.alt{text-align:center;margin-top:18px;font-size:.85rem;color:var(--mut)}
.alt a{color:var(--amber);cursor:pointer;font-weight:600}
.alertbox{border-radius:12px;padding:12px 15px;margin-bottom:16px;font-size:.87rem}
.alertbox.err{background:rgba(248,113,113,.12);border:1px solid rgba(248,113,113,.4);color:#fca5a5}
.alertbox.ok{background:rgba(110,231,183,.1);border:1px solid rgba(110,231,183,.35);color:#6ee7b7}
.back{display:block;text-align:center;margin-top:22px;font-size:.83rem;color:var(--mut)}
.back:hover{color:var(--txt)}
@media(max-width:820px){.shell{grid-template-columns:1fr}.side{display:none}.formbox{padding:36px 26px}}
</style>
</head>
<body>
<div class="shell">
  <div class="side">
    <div class="brand"><span class="bolt"><i class="fa-solid fa-bolt"></i></span>Placa<em>Certa</em></div>
    <h1>Sua conta,<br>sua <span>TV de volta.</span></h1>
    <p>Acompanhe pedidos, salve endereços e finalize em segundos.</p>
    <div class="perks">
      <div><i class="fa-solid fa-circle-check"></i> Pedidos e rastreio em um lugar</div>
      <div><i class="fa-solid fa-circle-check"></i> Endereços salvos no checkout</div>
      <div><i class="fa-solid fa-circle-check"></i> Pix −5% e 12x no cartão</div>
    </div>
  </div>
  <div class="formbox">
    <div class="tabs">
      <button id="tabLogin" class="on" onclick="switchTab('login')">Entrar</button>
      <button id="tabRegister" onclick="switchTab('register')">Cadastrar</button>
    </div>
    <div id="loginForm" class="f on">
      <div id="loginAlert"></div>
      <div class="field"><label>E-mail</label><input type="email" id="loginEmail" placeholder="seu@email.com" autocomplete="username"></div>
      <div class="field"><label>Senha</label><input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()"></div>
      <button class="btn" onclick="login()">Entrar <i class="fa-solid fa-arrow-right"></i></button>
      <p class="alt"><a onclick="switchTab('forgot')">Esqueci a senha</a></p>
    </div>
    <div id="forgotForm" class="f">
      <div id="forgotAlert"></div>
      <div class="field"><label>E-mail da conta</label><input type="email" id="forgotEmail" placeholder="seu@email.com"></div>
      <button class="btn" onclick="forgot()">Enviar instruções</button>
      <div id="resetBlock" style="display:none;margin-top:18px">
        <div class="field"><label>Token recebido</label><input type="text" id="resetToken" placeholder="cole o token"></div>
        <div class="field"><label>Nova senha (mín. 8)</label><input type="password" id="resetPassword" autocomplete="new-password"></div>
        <button class="btn" onclick="resetPassword()">Redefinir senha</button>
      </div>
      <p class="alt"><a onclick="switchTab('login')">Voltar ao login</a></p>
    </div>
    <div id="registerForm" class="f">
      <div id="registerAlert"></div>
      <div class="field"><label>Nome</label><input type="text" id="regNome" placeholder="Seu nome" autocomplete="name"></div>
      <div class="field"><label>E-mail</label><input type="email" id="regEmail" placeholder="seu@email.com" autocomplete="email"></div>
      <div class="field"><label>Telefone</label><input type="tel" id="regTelefone" placeholder="(11) 99999-9999" autocomplete="tel"></div>
      <div class="field"><label>Senha (mín. 8)</label><input type="password" id="regPassword" placeholder="••••••••" autocomplete="new-password"></div>
      <div class="field"><label>Confirmar senha</label><input type="password" id="regConfirm" placeholder="••••••••" autocomplete="new-password"></div>
      <button class="btn" onclick="register()">Criar conta <i class="fa-solid fa-arrow-right"></i></button>
    </div>
    <a class="back" href="/placas.html"><i class="fa-solid fa-arrow-left"></i> Voltar à loja</a>
  </div>
</div>
<script src="js/config.js?v=2"></script>
<script>
const API = window.API_BASE;
function showAlert(id, msg, isError){
  const el = document.getElementById(id); el.innerHTML = '';
  const box = document.createElement('div');
  box.className = 'alertbox ' + (isError ? 'err' : 'ok');
  box.textContent = String(msg ?? '');
  el.appendChild(box);
  setTimeout(()=>{ el.innerHTML = ''; }, 5000);
}
function switchTab(tab){
  const forms = { login:'loginForm', register:'registerForm', forgot:'forgotForm' };
  document.querySelectorAll('.f').forEach(f=>f.classList.remove('on'));
  document.getElementById(forms[tab]).classList.add('on');
  document.getElementById('tabLogin').classList.toggle('on', tab==='login');
  document.getElementById('tabRegister').classList.toggle('on', tab==='register'||tab==='forgot');
}
async function login(){
  try{
    const res = await fetch(API + '/auth/login', { method:'POST',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ email:document.getElementById('loginEmail').value, password:document.getElementById('loginPassword').value }) });
    const data = await res.json();
    if (data.success) {
      localStorage.setItem('token', data.token);
      localStorage.setItem('refreshToken', data.refreshToken);
      localStorage.setItem('user', JSON.stringify(data.user));
      window.location.href = '/placas.html';
    } else showAlert('loginAlert', data.message, true);
  }catch(e){ showAlert('loginAlert', 'Erro ao conectar', true); }
}
async function register(){
  if (document.getElementById('regPassword').value !== document.getElementById('regConfirm').value) {
    showAlert('registerAlert', 'Senhas não conferem', true); return;
  }
  try{
    const res = await fetch(API + '/auth/register', { method:'POST',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ nome:document.getElementById('regNome').value, email:document.getElementById('regEmail').value,
        telefone:document.getElementById('regTelefone').value, password:document.getElementById('regPassword').value }) });
    const data = await res.json();
    if (data.success) {
      localStorage.setItem('token', data.token);
      localStorage.setItem('refreshToken', data.refreshToken);
      localStorage.setItem('user', JSON.stringify(data.user));
      window.location.href = '/placas.html';
    } else showAlert('registerAlert', data.message, true);
  }catch(e){ showAlert('registerAlert', 'Erro ao conectar', true); }
}
async function forgot(){
  const email = document.getElementById('forgotEmail').value.trim();
  if (!email) { showAlert('forgotAlert', 'Informe o e-mail', true); return; }
  try{
    const res = await fetch(API + '/auth/forgot', { method:'POST',
      headers:{ 'Content-Type':'application/json' }, body: JSON.stringify({ email }) });
    const data = await res.json();
    showAlert('forgotAlert', data.message || 'Verifique seu e-mail', false);
    if (data.resetToken) {
      document.getElementById('resetToken').value = data.resetToken;
      document.getElementById('resetBlock').style.display = '';
      showAlert('forgotAlert', 'Modo dev: token preenchido abaixo (em produção chega por e-mail).', false);
    }
  }catch(e){ showAlert('forgotAlert', 'Erro ao conectar', true); }
}
async function resetPassword(){
  const token = document.getElementById('resetToken').value.trim();
  const password = document.getElementById('resetPassword').value;
  if (!token || password.length < 8) { showAlert('forgotAlert', 'Token e senha (mín. 8) obrigatórios', true); return; }
  try{
    const res = await fetch(API + '/auth/reset', { method:'POST',
      headers:{ 'Content-Type':'application/json' }, body: JSON.stringify({ token, password }) });
    const data = await res.json();
    if (data.success) { showAlert('forgotAlert', 'Senha redefinida! Entre com a nova senha.', false); setTimeout(()=>switchTab('login'), 1500); }
    else showAlert('forgotAlert', data.message || 'Token inválido', true);
  }catch(e){ showAlert('forgotAlert', 'Erro ao conectar', true); }
}
</script>
</body>
</html>
