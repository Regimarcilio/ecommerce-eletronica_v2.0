<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | TechStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 100%);
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .auth-card {
            background: rgba(26,26,46,0.9);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 450px;
            border: 1px solid rgba(67,97,238,0.3);
        }
        .form-control {
            background: #1a1a2e;
            border: 1px solid #4361ee;
            color: white;
            padding: 12px;
        }
        .form-control:focus {
            background: #1a1a2e;
            color: white;
            border-color: #4cc9f0;
            box-shadow: none;
        }
        .btn-primary {
            background: linear-gradient(135deg, #4361ee, #3a0ca3);
            border: none;
            padding: 12px;
            width: 100%;
        }
        .nav-tabs .nav-link {
            color: white;
            border: none;
            background: transparent;
        }
        .nav-tabs .nav-link.active {
            background: linear-gradient(135deg, #4361ee, #3a0ca3);
            color: white;
            border-radius: 10px;
        }
        .alert { border-radius: 10px; }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="text-center mb-4">
            <i class="bi bi-cpu" style="font-size: 3rem; color: #4361ee;"></i>
            <h2 class="mt-2">TechStore</h2>
        </div>
        
        <ul class="nav nav-tabs mb-4 justify-content-center" id="authTab" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="login-tab" data-bs-toggle="tab" data-bs-target="#login" type="button" role="tab">Entrar</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="register-tab" data-bs-toggle="tab" data-bs-target="#register" type="button" role="tab">Cadastrar</button>
            </li>
        </ul>
        
        <div class="tab-content">
            <div class="tab-pane fade show active" id="login" role="tabpanel">
                <div id="loginAlert"></div>
                <form id="loginForm">
                    <div class="mb-3"><input type="email" id="loginEmail" class="form-control" placeholder="Email" value="admin@techstore.com.br"></div>
                    <div class="mb-3"><input type="password" id="loginPassword" class="form-control" placeholder="Senha" value="***REMOVED***"></div>
                    <button type="submit" class="btn btn-primary">Entrar</button>
                </form>
            </div>
            <div class="tab-pane fade" id="register" role="tabpanel">
                <div id="registerAlert"></div>
                <form id="registerForm">
                    <div class="mb-3"><input type="text" id="regNome" class="form-control" placeholder="Nome completo"></div>
                    <div class="mb-3"><input type="email" id="regEmail" class="form-control" placeholder="Email"></div>
                    <div class="mb-3"><input type="tel" id="regTelefone" class="form-control" placeholder="Telefone"></div>
                    <div class="mb-3"><input type="password" id="regPassword" class="form-control" placeholder="Senha"></div>
                    <div class="mb-3"><input type="password" id="regConfirmPassword" class="form-control" placeholder="Confirmar senha"></div>
                    <button type="submit" class="btn btn-primary">Cadastrar</button>
                </form>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function showAlert(containerId, message, type) {
            const container = document.getElementById(containerId);
            container.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
            setTimeout(() => container.innerHTML = '', 5000);
        }
        
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: document.getElementById('loginEmail').value, password: document.getElementById('loginPassword').value })
                });
                const data = await res.json();
                if (data.success) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    showAlert('loginAlert', 'Login realizado!', 'success');
                    setTimeout(() => window.location.href = '/', 1000);
                } else showAlert('loginAlert', data.message, 'danger');
            } catch (error) { showAlert('loginAlert', 'Erro ao conectar', 'danger'); }
        });
        
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (document.getElementById('regPassword').value !== document.getElementById('regConfirmPassword').value) {
                showAlert('registerAlert', 'Senhas não conferem', 'danger');
                return;
            }
            try {
                const res = await fetch('/api/auth/register', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        nome: document.getElementById('regNome').value,
                        email: document.getElementById('regEmail').value,
                        telefone: document.getElementById('regTelefone').value,
                        password: document.getElementById('regPassword').value
                    })
                });
                const data = await res.json();
                if (data.success) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    showAlert('registerAlert', 'Cadastro realizado!', 'success');
                    setTimeout(() => window.location.href = '/', 1000);
                } else showAlert('registerAlert', data.message, 'danger');
            } catch (error) { showAlert('registerAlert', 'Erro ao conectar', 'danger'); }
        });
    </script>
</body>
</html>
