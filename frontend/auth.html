<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | TechStore</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <h2 class="auth-title">TechStore</h2>
            <div class="auth-tabs">
                <button class="auth-tab active" onclick="switchTab('login')">Entrar</button>
                <button class="auth-tab" onclick="switchTab('register')">Cadastrar</button>
            </div>
            <div id="loginForm" class="auth-form active">
                <div id="loginAlert"></div>
                <div class="form-group"><label>Email</label><input type="email" id="loginEmail" placeholder="seu@email.com" autocomplete="username"></div>
                <div class="form-group"><label>Senha</label><input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password"></div>
                <button class="btn-primary auth-btn" onclick="login()">Entrar</button>
                <p class="text-center mt-3"><a href="#" onclick="switchTab('forgot'); return false;" style="font-size:.9rem;">Esqueci a senha</a></p>
            </div>
            <div id="forgotForm" class="auth-form">
                <div id="forgotAlert"></div>
                <div class="form-group"><label>Email da conta</label><input type="email" id="forgotEmail" placeholder="seu@email.com"></div>
                <button class="btn-primary auth-btn" onclick="forgot()">Enviar instrucoes</button>
                <div id="resetBlock" style="display:none; margin-top:15px;">
                    <div class="form-group"><label>Token recebido</label><input type="text" id="resetToken" placeholder="cole o token"></div>
                    <div class="form-group"><label>Nova senha (min 8)</label><input type="password" id="resetPassword" autocomplete="new-password"></div>
                    <button class="btn-primary auth-btn" onclick="resetPassword()">Redefinir senha</button>
                </div>
            </div>
            <div id="registerForm" class="auth-form">
                <div id="registerAlert"></div>
                <div class="form-group"><label>Nome</label><input type="text" id="regNome"></div>
                <div class="form-group"><label>Email</label><input type="email" id="regEmail"></div>
                <div class="form-group"><label>Telefone</label><input type="tel" id="regTelefone"></div>
                <div class="form-group"><label>Senha</label><input type="password" id="regPassword"></div>
                <div class="form-group"><label>Confirmar Senha</label><input type="password" id="regConfirm"></div>
                <button class="btn-primary auth-btn" onclick="register()">Cadastrar</button>
            </div>
        </div>
    </div>
    <script src="js/config.js?v=2"></script>
    <script>
        const API = window.API_BASE;
        
        function showAlert(id, msg, isError) {
            const el = document.getElementById(id);
            el.innerHTML = '';
            const box = document.createElement('div');
            box.style.cssText = `background:${isError ? '#ef444420' : '#10b98120'};padding:10px;border-radius:8px;margin-bottom:15px`;
            box.textContent = String(msg ?? '');
            el.appendChild(box);
            setTimeout(() => el.innerHTML = '', 5000);
        }
        
        function switchTab(tab) {
            const forms = { login: 'loginForm', register: 'registerForm', forgot: 'forgotForm' };
            document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
            document.getElementById(forms[tab]).classList.add('active');
            const tabs = document.querySelectorAll('.auth-tab');
            if (tabs[tab === 'login' ? 0 : 1]) tabs[tab === 'login' ? 0 : 1].classList.add('active');
        }
        
        async function login() {
            try {
                const res = await fetch(API + '/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: document.getElementById('loginEmail').value,
                        password: document.getElementById('loginPassword').value
                    })
                });
                const data = await res.json();
                if (data.success) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('refreshToken', data.refreshToken);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    window.location.href = '/';
                } else {
                    showAlert('loginAlert', data.message, true);
                }
            } catch(e) { showAlert('loginAlert', 'Erro ao conectar', true); }
        }
        
        async function register() {
            if (document.getElementById('regPassword').value !== document.getElementById('regConfirm').value) {
                showAlert('registerAlert', 'Senhas não conferem', true);
                return;
            }
            try {
                const res = await fetch(API + '/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        nome: document.getElementById('regNome').value,
                        email: document.getElementById('regEmail').value,
                        telefone: document.getElementById('regTelefone').value,
                        password: document.getElementById('regPassword').value
                    })
                });
                const data = await res.json();
                if (data.success) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('refreshToken', data.refreshToken);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    window.location.href = '/';
                } else {
                    showAlert('registerAlert', data.message, true);
                }
            } catch(e) { showAlert('registerAlert', 'Erro ao conectar', true); }
        }

        async function forgot() {
            const email = document.getElementById('forgotEmail').value.trim();
            if (!email) { showAlert('forgotAlert', 'Informe o e-mail', true); return; }
            try {
                const res = await fetch(API + '/auth/forgot', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const data = await res.json();
                showAlert('forgotAlert', data.message || 'Verifique seu e-mail', false);
                if (data.resetToken) {
                    document.getElementById('resetToken').value = data.resetToken;
                    document.getElementById('resetBlock').style.display = '';
                    showAlert('forgotAlert', 'Modo dev: token preenchido abaixo (em producao chega por e-mail).', false);
                }
            } catch(e) { showAlert('forgotAlert', 'Erro ao conectar', true); }
        }

        async function resetPassword() {
            const token = document.getElementById('resetToken').value.trim();
            const password = document.getElementById('resetPassword').value;
            if (!token || password.length < 8) { showAlert('forgotAlert', 'Token e senha (min 8) obrigatórios', true); return; }
            try {
                const res = await fetch(API + '/auth/reset', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, password })
                });
                const data = await res.json();
                if (data.success) {
                    showAlert('forgotAlert', 'Senha redefinida! Entre com a nova senha.', false);
                    setTimeout(() => switchTab('login'), 1500);
                } else showAlert('forgotAlert', data.message || 'Token inválido', true);
            } catch(e) { showAlert('forgotAlert', 'Erro ao conectar', true); }
        }
    </script>
</body>
</html>
