<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | TechStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; position: relative; }
        @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 0.8; } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        body::before { content: ''; position: absolute; width: 200%; height: 200%; background: radial-gradient(circle, rgba(67,97,238,0.15) 0%, transparent 70%); animation: pulse 8s ease-in-out infinite; }
        .auth-container { position: relative; z-index: 2; width: 100%; max-width: 480px; margin: 20px; animation: fadeInUp 0.6s ease-out; }
        .auth-tabs { display: flex; gap: 10px; margin-bottom: 30px; background: rgba(26,26,46,0.5); backdrop-filter: blur(10px); border-radius: 60px; padding: 8px; border: 1px solid rgba(67,97,238,0.3); }
        .tab-btn { flex: 1; padding: 14px; background: transparent; border: none; border-radius: 50px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.3s; color: rgba(255,255,255,0.6); display: flex; align-items: center; justify-content: center; gap: 10px; }
        .tab-btn.active { background: linear-gradient(135deg, #4361ee, #3a0ca3); color: white; box-shadow: 0 5px 15px rgba(67,97,238,0.3); }
        .auth-card { background: rgba(26,26,46,0.8); backdrop-filter: blur(20px); border-radius: 30px; padding: 40px; border: 1px solid rgba(67,97,238,0.3); }
        .logo { text-align: center; margin-bottom: 30px; }
        .logo i { font-size: 3rem; background: linear-gradient(135deg, #4361ee, #4cc9f0); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .logo h2 { margin-top: 10px; font-size: 1.8rem; font-weight: 700; }
        .form-group { margin-bottom: 20px; }
        .input-icon { position: relative; }
        .input-icon i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #4361ee; }
        .form-control-custom { width: 100%; padding: 14px 20px 14px 45px; background: rgba(10,10,15,0.8); border: 1px solid rgba(67,97,238,0.3); border-radius: 15px; color: white; font-size: 1rem; transition: all 0.3s; }
        .form-control-custom:focus { outline: none; border-color: #4361ee; box-shadow: 0 0 0 3px rgba(67,97,238,0.2); }
        .btn-auth { width: 100%; padding: 14px; background: linear-gradient(135deg, #4361ee, #3a0ca3); border: none; border-radius: 15px; color: white; font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.3s; margin-top: 10px; }
        .btn-auth:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(67,97,238,0.4); }
        .alert-custom { padding: 12px 15px; border-radius: 12px; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
        .alert-success { background: rgba(76,201,240,0.2); border-left: 3px solid #4cc9f0; color: #4cc9f0; }
        .alert-danger { background: rgba(239,35,60,0.2); border-left: 3px solid #ef233c; color: #ef233c; }
        .hidden { display: none; }
        @media (max-width: 550px) { .auth-card { padding: 25px; } .tab-btn span { display: none; } }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-tabs">
            <button class="tab-btn active" onclick="switchTab('login')"><i class="bi bi-box-arrow-in-right"></i><span>Entrar</span></button>
            <button class="tab-btn" onclick="switchTab('register')"><i class="bi bi-person-plus"></i><span>Criar Conta</span></button>
        </div>
        <div id="loginPanel" class="auth-card">
            <div class="logo"><i class="bi bi-cpu"></i><h2>Bem-vindo de volta!</h2></div>
            <div id="loginAlert"></div>
            <form id="loginForm">
                <div class="form-group"><div class="input-icon"><i class="bi bi-envelope"></i><input type="email" id="loginEmail" class="form-control-custom" placeholder="seu@email.com" value="admin@techstore.com.br"></div></div>
                <div class="form-group"><div class="input-icon"><i class="bi bi-lock"></i><input type="password" id="loginPassword" class="form-control-custom" placeholder="••••••••" value="***REMOVED***"></div></div>
                <button type="submit" class="btn-auth"><i class="bi bi-box-arrow-in-right"></i> Entrar</button>
            </form>
        </div>
        <div id="registerPanel" class="auth-card hidden">
            <div class="logo"><i class="bi bi-person-plus"></i><h2>Criar conta gratuita</h2></div>
            <div id="registerAlert"></div>
            <form id="registerForm">
                <div class="form-group"><div class="input-icon"><i class="bi bi-person"></i><input type="text" id="regNome" class="form-control-custom" placeholder="Seu nome completo"></div></div>
                <div class="form-group"><div class="input-icon"><i class="bi bi-envelope"></i><input type="email" id="regEmail" class="form-control-custom" placeholder="seu@email.com"></div></div>
                <div class="form-group"><div class="input-icon"><i class="bi bi-phone"></i><input type="tel" id="regTelefone" class="form-control-custom" placeholder="(11) 99999-9999"></div></div>
                <div class="form-group"><div class="input-icon"><i class="bi bi-lock"></i><input type="password" id="regPassword" class="form-control-custom" placeholder="Crie uma senha forte"></div></div>
                <div class="form-group"><div class="input-icon"><i class="bi bi-shield-lock"></i><input type="password" id="regConfirmPassword" class="form-control-custom" placeholder="Digite a senha novamente"></div></div>
                <button type="submit" class="btn-auth"><i class="bi bi-person-plus"></i> Criar conta gratuita</button>
            </form>
        </div>
    </div>
    <script>
        const API_URL = 'http://localhost:5000/api';
        
        function switchTab(tab) {
            const loginPanel = document.getElementById('loginPanel');
            const registerPanel = document.getElementById('registerPanel');
            const tabs = document.querySelectorAll('.tab-btn');
            if (tab === 'login') {
                loginPanel.classList.remove('hidden');
                registerPanel.classList.add('hidden');
                tabs[0].classList.add('active');
                tabs[1].classList.remove('active');
            } else {
                loginPanel.classList.add('hidden');
                registerPanel.classList.remove('hidden');
                tabs[0].classList.remove('active');
                tabs[1].classList.add('active');
            }
        }
        
        function showAlert(containerId, message, type) {
            const container = document.getElementById(containerId);
            container.innerHTML = `<div class="alert-custom alert-${type}"><i class="bi bi-${type === 'success' ? 'check-circle' : 'exclamation-triangle'}"></i> ${message}</div>`;
            setTimeout(() => container.innerHTML = '', 5000);
        }
        
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                const res = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: document.getElementById('loginEmail').value, password: document.getElementById('loginPassword').value })
                });
                const data = await res.json();
                if (data.success) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    showAlert('loginAlert', 'Login realizado! Redirecionando...', 'success');
                    setTimeout(() => window.location.href = '/', 1000);
                } else showAlert('loginAlert', data.message || 'Credenciais inválidas', 'danger');
            } catch (error) { showAlert('loginAlert', 'Erro ao conectar', 'danger'); }
        });
        
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (document.getElementById('regPassword').value !== document.getElementById('regConfirmPassword').value) {
                showAlert('registerAlert', 'Senhas não conferem', 'danger');
                return;
            }
            try {
                const res = await fetch(`${API_URL}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        nome: document.getElementById('regNome').value,
                        email: document.getElementById('regEmail').value,
                        telefone: document.getElementById('regTelefone').value,
                        password: document.getElementById('regPassword').value
                    })
                });
                const data = await res.json();
                if (data.success) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    showAlert('registerAlert', 'Cadastro realizado! Redirecionando...', 'success');
                    setTimeout(() => window.location.href = '/', 1000);
                } else showAlert('registerAlert', data.message || 'Erro no cadastro', 'danger');
            } catch (error) { showAlert('registerAlert', 'Erro ao conectar', 'danger'); }
        });
    </script>
</body>
</html>
