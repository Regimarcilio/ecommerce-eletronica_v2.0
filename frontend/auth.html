<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login ou Cadastro | TechStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/assets/css/style.css">
    <style>
        body { background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .auth-container { max-width: 500px; width: 100%; margin: 20px; }
        .auth-tabs { display: flex; gap: 10px; margin-bottom: 30px; background: rgba(26,26,46,0.5); border-radius: 60px; padding: 8px; }
        .tab-btn { flex: 1; padding: 14px; background: transparent; border: none; border-radius: 50px; font-weight: 600; color: rgba(255,255,255,0.6); }
        .tab-btn.active { background: linear-gradient(135deg, #4361ee, #3a0ca3); color: white; }
        .auth-card { background: rgba(26,26,46,0.8); backdrop-filter: blur(20px); border-radius: 30px; padding: 35px; border: 1px solid rgba(67,97,238,0.3); }
        .form-group { margin-bottom: 20px; }
        .form-group input { width: 100%; padding: 14px 20px; background: rgba(10,10,15,0.8); border: 1px solid rgba(67,97,238,0.3); border-radius: 15px; color: white; }
        .form-group input:focus { outline: none; border-color: #4361ee; }
        .btn-auth { width: 100%; padding: 14px; background: linear-gradient(135deg, #4361ee, #3a0ca3); border: none; border-radius: 15px; color: white; font-weight: 600; }
        .hidden { display: none; }
        .alert-custom { padding: 12px; border-radius: 12px; margin-bottom: 20px; }
        .alert-success { background: rgba(76,201,240,0.2); color: #4cc9f0; }
        .alert-danger { background: rgba(239,35,60,0.2); color: #ef233c; }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-tabs">
            <button class="tab-btn active" onclick="switchTab('login')">Entrar</button>
            <button class="tab-btn" onclick="switchTab('register')">Criar Conta</button>
        </div>
        <div id="loginPanel" class="auth-card">
            <div id="loginAlert"></div>
            <form id="loginForm">
                <div class="form-group"><input type="email" id="loginEmail" placeholder="Email" value="admin@techstore.com.br" required></div>
                <div class="form-group"><input type="password" id="loginPassword" placeholder="Senha" value="***REMOVED***" required></div>
                <button type="submit" class="btn-auth">Entrar</button>
            </form>
        </div>
        <div id="registerPanel" class="auth-card hidden">
            <div id="registerAlert"></div>
            <form id="registerForm">
                <div class="form-group"><input type="text" id="regNome" placeholder="Nome completo" required></div>
                <div class="form-group"><input type="email" id="regEmail" placeholder="Email" required></div>
                <div class="form-group"><input type="tel" id="regTelefone" placeholder="Telefone" required></div>
                <div class="form-group"><input type="password" id="regPassword" placeholder="Senha" required></div>
                <div class="form-group"><input type="password" id="regConfirmPassword" placeholder="Confirmar senha" required></div>
                <button type="submit" class="btn-auth">Criar Conta</button>
            </form>
        </div>
    </div>
    <script>
        function switchTab(tab) {
            const loginPanel = document.getElementById('loginPanel');
            const registerPanel = document.getElementById('registerPanel');
            const tabs = document.querySelectorAll('.tab-btn');
            if (tab === 'login') {
                loginPanel.classList.remove('hidden');
                registerPanel.classList.add('hidden');
                tabs[0].classList.add('active');
                tabs[1].classList.remove('active');
            } else {
                loginPanel.classList.add('hidden');
                registerPanel.classList.remove('hidden');
                tabs[0].classList.remove('active');
                tabs[1].classList.add('active');
            }
        }
        function showAlert(containerId, message, type) {
            const container = document.getElementById(containerId);
            container.innerHTML = `<div class="alert-custom alert-${type}">${message}</div>`;
            setTimeout(() => container.innerHTML = '', 5000);
        }
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: document.getElementById('loginEmail').value, password: document.getElementById('loginPassword').value })
                });
                const data = await res.json();
                if (data.success) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    showAlert('loginAlert', 'Login realizado! Redirecionando...', 'success');
                    setTimeout(() => window.location.href = '/', 1000);
                } else showAlert('loginAlert', data.message || 'Erro no login', 'danger');
            } catch (error) { showAlert('loginAlert', 'Erro ao conectar', 'danger'); }
        });
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (document.getElementById('regPassword').value !== document.getElementById('regConfirmPassword').value) {
                showAlert('registerAlert', 'Senhas não conferem', 'danger');
                return;
            }
            try {
                const res = await fetch('/api/auth/register', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        nome: document.getElementById('regNome').value,
                        email: document.getElementById('regEmail').value,
                        telefone: document.getElementById('regTelefone').value,
                        password: document.getElementById('regPassword').value
                    })
                });
                const data = await res.json();
                if (data.success) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    showAlert('registerAlert', 'Cadastro realizado! Redirecionando...', 'success');
                    setTimeout(() => window.location.href = '/', 1000);
                } else showAlert('registerAlert', data.message || 'Erro no cadastro', 'danger');
            } catch (error) { showAlert('registerAlert', 'Erro ao conectar', 'danger'); }
        });
    </script>
</body>
</html>
