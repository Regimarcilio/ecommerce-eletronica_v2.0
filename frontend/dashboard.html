<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | TechStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a0f; color: #fff; font-family: 'Segoe UI', sans-serif; }
        .sidebar { position: fixed; left: 0; top: 0; width: 280px; height: 100%; background: #0d1117; border-right: 1px solid #1f2937; padding: 20px; overflow-y: auto; }
        .sidebar h3 { background: linear-gradient(135deg, #4361ee, #4cc9f0); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 30px; text-align: center; }
        .sidebar .menu-item { display: block; padding: 12px 16px; color: #9ca3af; margin: 5px 0; border-radius: 10px; cursor: pointer; transition: all 0.3s; }
        .sidebar .menu-item:hover, .sidebar .menu-item.active { background: #4361ee; color: #fff; }
        .sidebar .menu-item i { margin-right: 12px; width: 25px; }
        .main-content { margin-left: 300px; padding: 20px; }
        .top-bar { background: #0d1117; border: 1px solid #1f2937; border-radius: 12px; padding: 15px 25px; margin-bottom: 25px; display: flex; justify-content: space-between; align-items: center; }
        .logout-btn { background: #ef4444; border: none; color: #fff; padding: 8px 20px; border-radius: 8px; cursor: pointer; }
        .logout-btn:hover { background: #dc2626; }
        .stat-card { background: #0d1117; border: 1px solid #1f2937; border-radius: 12px; padding: 20px; text-align: center; transition: all 0.3s; }
        .stat-card:hover { transform: translateY(-3px); border-color: #4361ee; }
        .stat-value { font-size: 2rem; font-weight: bold; color: #4361ee; margin-top: 10px; }
        .data-card { background: #0d1117; border: 1px solid #1f2937; border-radius: 12px; padding: 20px; margin-top: 20px; }
        .btn-primary-custom { background: linear-gradient(135deg, #4361ee, #3a0ca3); border: none; color: #fff; padding: 8px 20px; border-radius: 8px; cursor: pointer; transition: all 0.3s; }
        .btn-primary-custom:hover { transform: translateY(-1px); box-shadow: 0 5px 15px rgba(67,97,238,0.4); }
        .btn-secondary-custom { background: #1f2937; border: none; color: #fff; padding: 8px 20px; border-radius: 8px; cursor: pointer; transition: all 0.3s; }
        .btn-secondary-custom:hover { background: #374151; }
        .btn-edit { background: #0f172a; border: 1px solid #f59e0b; color: #f59e0b; padding: 5px 12px; border-radius: 6px; cursor: pointer; margin-right: 5px; }
        .btn-edit:hover { background: #f59e0b; color: #0f172a; }
        .btn-delete { background: #0f172a; border: 1px solid #ef4444; color: #ef4444; padding: 5px 12px; border-radius: 6px; cursor: pointer; }
        .btn-delete:hover { background: #ef4444; color: #0f172a; }
        .btn-view { background: #0f172a; border: 1px solid #06b6d4; color: #06b6d4; padding: 5px 12px; border-radius: 6px; cursor: pointer; }
        .btn-view:hover { background: #06b6d4; color: #0f172a; }
        .btn-status { background: #0f172a; border: 1px solid #8b5cf6; color: #8b5cf6; padding: 5px 12px; border-radius: 6px; cursor: pointer; margin-left: 5px; }
        .btn-status:hover { background: #8b5cf6; color: #0f172a; }
        .btn-new-cat { background: #0f172a; border: 1px solid #10b981; color: #10b981; padding: 5px 12px; border-radius: 6px; cursor: pointer; margin-left: 10px; font-size: 12px; }
        .btn-new-cat:hover { background: #10b981; color: #0f172a; }
        .table-responsive { overflow-x: auto; }
        .table-dark { background: #0d1117; color: #fff; }
        .table-dark th { border-bottom: 1px solid #1f2937; color: #9ca3af; font-weight: 600; padding: 12px; }
        .table-dark td { padding: 12px; border-bottom: 1px solid #1f2937; }
        .table-dark tr:hover { background: #1a1a2e; }
        .badge-active { background: #10b98120; color: #10b981; padding: 4px 12px; border-radius: 20px; font-size: 12px; border: 1px solid #10b981; }
        .badge-warning { background: #f59e0b20; color: #f59e0b; padding: 4px 12px; border-radius: 20px; font-size: 12px; border: 1px solid #f59e0b; }
        .badge-info { background: #06b6d420; color: #06b6d4; padding: 4px 12px; border-radius: 20px; font-size: 12px; border: 1px solid #06b6d4; }
        .badge-success { background: #10b98120; color: #10b981; padding: 4px 12px; border-radius: 20px; font-size: 12px; border: 1px solid #10b981; }
        .modal-content { background: #0d1117; border: 1px solid #1f2937; border-radius: 16px; }
        .modal-header { border-bottom-color: #1f2937; }
        .modal-footer { border-top-color: #1f2937; }
        .btn-close-white { filter: brightness(0) invert(1); }
        .form-control, .form-select { background: #0a0a0f; border: 1px solid #4361ee; color: #fff; padding: 10px 12px; border-radius: 8px; }
        .form-control:focus, .form-select:focus { background: #0a0a0f; border-color: #4cc9f0; box-shadow: none; outline: none; }
        .toast-custom { position: fixed; bottom: 20px; right: 20px; background: #0d1117; border-left: 3px solid #10b981; padding: 12px 20px; border-radius: 8px; z-index: 9999; animation: slideIn 0.3s ease; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .spinner-border { color: #4361ee; }
        .categoria-select-group { display: flex; gap: 10px; align-items: center; }
        .categoria-select-group select { flex: 1; }
        .search-categoria { margin-bottom: 10px; }
        .search-categoria input { width: 100%; padding: 8px; font-size: 14px; }
        .categoria-list { max-height: 200px; overflow-y: auto; }
        .categoria-item { padding: 8px 12px; cursor: pointer; border-radius: 6px; transition: all 0.2s; }
        .categoria-item:hover { background: #1f2937; }
        .categoria-item.selected { background: #4361ee; color: #fff; }
        @media (max-width: 768px) { .sidebar { width: 70px; } .sidebar .menu-item span { display: none; } .main-content { margin-left: 90px; } }
    </style>
</head>
<body>
    <div class="sidebar">
        <h3><i class="fas fa-microchip"></i> TechStore</h3>
        <div class="menu-item active" onclick="loadDashboard()"><i class="fas fa-chart-line"></i> <span>Dashboard</span></div>
        <div class="menu-item" onclick="loadProdutos()"><i class="fas fa-box"></i> <span>Produtos</span></div>
        <div class="menu-item" onclick="loadCategorias()"><i class="fas fa-tags"></i> <span>Categorias</span></div>
        <div class="menu-item" onclick="loadPedidos()"><i class="fas fa-shopping-cart"></i> <span>Pedidos</span></div>
        <div class="menu-item" onclick="loadClientes()"><i class="fas fa-users"></i> <span>Clientes</span></div>
    </div>
    <div class="main-content">
        <div class="top-bar">
            <h2 id="pageTitle" style="margin:0;">Dashboard</h2>
            <div><span id="userName"></span> <button class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Sair</button></div>
        </div>
        <div id="content"></div>
    </div>

    <!-- Modal Produto (com categoria) -->
    <div class="modal fade" id="produtoModal" tabindex="-1">
        <div class="modal-dialog modal-lg"><div class="modal-content"><div class="modal-header border-0"><h5 class="modal-title" id="produtoModalTitle"><i class="fas fa-box"></i> Produto</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">
            <input type="hidden" id="produtoId">
            <div class="row">
                <div class="col-md-6 mb-3"><label class="form-label">Nome *</label><input type="text" id="prodNome" class="form-control"></div>
                <div class="col-md-6 mb-3"><label class="form-label">SKU *</label><input type="text" id="prodSku" class="form-control"></div>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3"><label class="form-label">Preço (R$)</label><input type="number" step="0.01" id="prodPreco" class="form-control"></div>
                <div class="col-md-6 mb-3"><label class="form-label">Quantidade em Estoque</label><input type="number" id="prodQuantidade" class="form-control"></div>
            </div>
            <div class="mb-3">
                <label class="form-label">Categoria *</label>
                <div class="categoria-select-group">
                    <select id="prodCategoria" class="form-select"></select>
                    <button type="button" class="btn-new-cat" onclick="abrirModalNovaCategoriaRapida()" title="Nova Categoria"><i class="fas fa-plus"></i> Nova</button>
                </div>
                <small class="text-muted">Se a categoria não existir, clique em "Nova" para criar</small>
            </div>
            <div class="mb-3"><label class="form-label">Status</label><select id="prodStatus" class="form-select"><option value="ativo">Ativo</option><option value="inativo">Inativo</option></select></div>
        </div>
        <div class="modal-footer border-0"><button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button><button class="btn btn-primary-custom" onclick="salvarProduto()">Salvar</button></div></div></div>
    </div>

    <!-- Modal Nova Categoria Rápida (dentro do produto) -->
    <div class="modal fade" id="novaCategoriaRapidaModal" tabindex="-1">
        <div class="modal-dialog"><div class="modal-content"><div class="modal-header border-0"><h5 class="modal-title"><i class="fas fa-plus-circle"></i> Nova Categoria</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">
            <div class="mb-3"><label class="form-label">Nome da Categoria *</label><input type="text" id="novaCatNome" class="form-control" placeholder="Ex: Placa Mãe, Fonte, Memória..."></div>
            <div class="mb-3"><label class="form-label">Ícone (Font Awesome)</label><input type="text" id="novaCatIcone" class="form-control" value="fa-microchip" placeholder="fa-microchip"></div>
            <div class="mb-3"><label class="form-label">Slug (opcional)</label><input type="text" id="novaCatSlug" class="form-control" placeholder="deixe em branco para gerar automaticamente"></div>
        </div>
        <div class="modal-footer border-0"><button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button><button class="btn btn-primary-custom" onclick="criarCategoriaRapida()">Criar e Usar</button></div></div></div>
    </div>

    <!-- Modal Categoria (CRUD normal) -->
    <div class="modal fade" id="categoriaModal" tabindex="-1">
        <div class="modal-dialog"><div class="modal-content"><div class="modal-header border-0"><h5 class="modal-title" id="categoriaModalTitle"><i class="fas fa-tag"></i> Categoria</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div>
        <div class="modal-body"><input type="hidden" id="categoriaId"><div class="mb-3"><label class="form-label">Nome</label><input type="text" id="catNome" class="form-control"></div><div class="mb-3"><label class="form-label">Ícone</label><input type="text" id="catIcone" class="form-control" value="fa-microchip"></div><div class="mb-3"><label class="form-label">Status</label><select id="catStatus" class="form-select"><option value="ativo">Ativo</option><option value="inativo">Inativo</option></select></div></div>
        <div class="modal-footer border-0"><button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button><button class="btn btn-primary-custom" onclick="salvarCategoria()">Salvar</button></div></div></div>
    </div>

    <!-- Modal Detalhes Pedido -->
    <div class="modal fade" id="pedidoModal" tabindex="-1">
        <div class="modal-dialog modal-lg"><div class="modal-content"><div class="modal-header border-0"><h5 class="modal-title"><i class="fas fa-shopping-cart"></i> Detalhes do Pedido</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div>
        <div class="modal-body pedido-detalhes" id="pedidoDetalhesBody"></div><div class="modal-footer border-0"><button class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button></div></div></div>
    </div>

    <!-- Modal Status -->
    <div class="modal fade" id="statusModal" tabindex="-1">
        <div class="modal-dialog"><div class="modal-content"><div class="modal-header border-0"><h5 class="modal-title"><i class="fas fa-truck"></i> Alterar Status do Pedido</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div>
        <div class="modal-body"><div class="mb-3"><label class="form-label">Status</label><select id="statusSelecionado" class="form-select"><option value="pendente">🟡 Pendente</option><option value="pago">💰 Pago</option><option value="enviado">📦 Enviado</option><option value="entregue">✅ Entregue</option><option value="cancelado">❌ Cancelado</option></select></div></div>
        <div class="modal-footer border-0"><button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button><button class="btn btn-primary-custom" onclick="atualizarStatusPedido()">Atualizar Status</button></div></div></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script>
        const API = window.API_BASE;
        const token = localStorage.getItem('token');
        const user = JSON.parse(localStorage.getItem('user') || '{}');
        
        if (!token) window.location.href = '/auth.html';
        // Guard real: valida no servidor (localStorage é burlável)
        fetch(API + '/auth/me', { headers: window.getAuthHeaders() }).then(async (r) => {
            if (!r.ok) { localStorage.removeItem('token'); localStorage.removeItem('user'); window.location.href = '/auth.html'; return; }
            const d = await r.json();
            if (!d.success || d.user?.role !== 'admin') { window.location.href = '/auth.html'; return; }
            localStorage.setItem('user', JSON.stringify({ id: d.user._id, nome: d.user.nome, email: d.user.email, role: d.user.role }));
            document.getElementById('userName').textContent = d.user.nome || 'Admin';
        }).catch(() => window.location.href = '/auth.html');
        document.getElementById('userName').textContent = (user && user.nome) || 'Admin';
        
        let produtoModal, categoriaModal, pedidoModal, statusModal, novaCategoriaRapidaModal;
        let pedidoAtualId = null;
        let listaCategorias = [];
        
        function getHeaders() { return { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' }; }
        
        function showToast(msg, isError) {
            const toast = document.createElement('div');
            toast.className = 'toast-custom';
            toast.style.borderLeftColor = isError ? '#ef4444' : '#10b981';
            toast.innerHTML = '<i class="fas ' + (isError ? 'fa-exclamation-triangle' : 'fa-check-circle') + '"></i> ';
            toast.appendChild(document.createTextNode(String(msg ?? '')));
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
        
        function logout() { localStorage.removeItem('token'); localStorage.removeItem('user'); window.location.href = '/auth.html'; }
        
        function getStatusClass(status) {
            const classes = { 'pendente': 'badge-warning', 'pago': 'badge-info', 'enviado': 'badge-info', 'entregue': 'badge-success', 'cancelado': 'badge-warning' };
            return classes[status] || 'badge-active';
        }
        
        function getStatusText(status) {
            const texts = { 'pendente': 'Pendente', 'pago': 'Pago', 'enviado': 'Enviado', 'entregue': 'Entregue', 'cancelado': 'Cancelado' };
            return texts[status] || status;
        }
        
        // ==================== CARREGAR CATEGORIAS PARA SELECT ====================
        async function carregarCategoriasParaSelect() {
            try {
                const res = await fetch(API + '/categorias', { headers: getHeaders() });
                const data = await res.json();
                if (data.success && data.categorias) {
                    listaCategorias = data.categorias;
                    const select = document.getElementById('prodCategoria');
                    if (select) {
                        let options = '<option value="">Selecione uma categoria...</option>';
                        for (const cat of data.categorias) {
                            options += `<option value="${cat._id}">${window.escapeHtml(cat.nome)} ${cat.status !== 'ativo' ? '(inativo)' : ''}</option>`;
                        }
                        select.innerHTML = options;
                    }
                    return data.categorias;
                }
                return [];
            } catch(e) {
                console.error('Erro ao carregar categorias:', e);
                return [];
            }
        }
        
        // ==================== CRIAR CATEGORIA RÁPIDA ====================
        async function criarCategoriaRapida() {
            const nome = document.getElementById('novaCatNome').value.trim();
            if (!nome) {
                showToast('Digite o nome da categoria!', true);
                return;
            }
            
            const slug = document.getElementById('novaCatSlug').value.trim() || nome.toLowerCase().replace(/[^a-z0-9]/g, '-');
            const icone = document.getElementById('novaCatIcone').value.trim() || 'fa-microchip';
            
            try {
                const res = await fetch(API + '/categorias', {
                    method: 'POST',
                    headers: getHeaders(),
                    body: JSON.stringify({ nome, slug, icone, status: 'ativo' })
                });
                const data = await res.json();
                if (data.success) {
                    showToast(`Categoria "${nome}" criada com sucesso!`);
                    novaCategoriaRapidaModal.hide();
                    // Recarregar o select de categorias
                    await carregarCategoriasParaSelect();
                    // Selecionar a nova categoria
                    document.getElementById('prodCategoria').value = data.categoria._id;
                    // Limpar campos
                    document.getElementById('novaCatNome').value = '';
                    document.getElementById('novaCatSlug').value = '';
                    document.getElementById('novaCatIcone').value = 'fa-microchip';
                } else {
                    showToast(data.message || 'Erro ao criar categoria', true);
                }
            } catch(e) {
                showToast('Erro ao conectar ao servidor', true);
            }
        }
        
        function abrirModalNovaCategoriaRapida() {
            if (!novaCategoriaRapidaModal) novaCategoriaRapidaModal = new bootstrap.Modal(document.getElementById('novaCategoriaRapidaModal'));
            document.getElementById('novaCatNome').value = '';
            document.getElementById('novaCatSlug').value = '';
            document.getElementById('novaCatIcone').value = 'fa-microchip';
            novaCategoriaRapidaModal.show();
        }
        
        // Dashboard
        async function loadDashboard() {
            document.getElementById('pageTitle').innerHTML = 'Dashboard';
            document.getElementById('content').innerHTML = '<div class="text-center p-5"><div class="spinner-border text-primary"></div></div>';
            try {
                const res = await fetch(API + '/dashboard/stats', { headers: getHeaders() });
                const data = await res.json();
                if (data.success) {
                    const s = data.stats;
                    document.getElementById('content').innerHTML = `
                        <div class="row g-4">
                            <div class="col-md-3"><div class="stat-card"><i class="fas fa-box fa-2x"></i><div class="stat-value">${s.totalProdutos || 0}</div><div>Produtos</div></div></div>
                            <div class="col-md-3"><div class="stat-card"><i class="fas fa-tags fa-2x"></i><div class="stat-value">${s.totalCategorias || 0}</div><div>Categorias</div></div></div>
                            <div class="col-md-3"><div class="stat-card"><i class="fas fa-users fa-2x"></i><div class="stat-value">${s.totalClientes || 0}</div><div>Clientes</div></div></div>
                            <div class="col-md-3"><div class="stat-card"><i class="fas fa-shopping-cart fa-2x"></i><div class="stat-value">${s.totalPedidos || 0}</div><div>Pedidos</div></div></div>
                        </div>
                        <div class="row mt-4"><div class="col-md-12"><div class="stat-card"><i class="fas fa-dollar-sign fa-2x"></i><div class="stat-value">R$ ${(s.vendasTotal || 0).toFixed(2)}</div><div>Faturamento</div></div></div></div>
                    `;
                }
            } catch(e) { document.getElementById('content').innerHTML = '<div class="alert alert-danger">Erro ao carregar dashboard</div>'; }
        }
        
        // ==================== PRODUTOS (COM CATEGORIA) ====================
        async function loadProdutos() {
            document.getElementById('pageTitle').innerHTML = 'Produtos';
            document.getElementById('content').innerHTML = '<div class="text-center p-5"><div class="spinner-border text-primary"></div></div>';
            try {
                const [prodRes, catRes] = await Promise.all([
                    fetch(API + '/produtos', { headers: getHeaders() }),
                    fetch(API + '/categorias', { headers: getHeaders() })
                ]);
                const prodData = await prodRes.json();
                const catData = await catRes.json();
                
                const categoriasMap = {};
                if (catData.success && catData.categorias) {
                    for (const cat of catData.categorias) {
                        categoriasMap[cat._id] = cat.nome;
                    }
                }
                
                if (prodData.success && prodData.produtos) {
                    let html = '<div class="data-card"><div class="d-flex justify-content-between mb-3"><h4>Produtos (' + prodData.produtos.length + ')</h4><button class="btn-primary-custom" onclick="abrirModalProduto()"><i class="fas fa-plus"></i> Novo Produto</button></div><div class="table-responsive"><table class="table table-dark"><thead><tr><th>Nome</th><th>SKU</th><th>Categoria</th><th>Preço</th><th>Estoque</th><th>Status</th><th>Ações</th></tr></thead><tbody>';
                    for (const p of prodData.produtos) {
                        const nomeCategoria = categoriasMap[p.categoria] || p.categoria_nome || 'Sem categoria';
                        html += `<tr>
                            <td>${window.escapeHtml(p.nome)}</td>
                            <td>${window.escapeHtml(p.sku ?? '-')}</td>
                            <td><span class="badge-active">${nomeCategoria}</span></td>
                            <td>R$ ${(Number(p.preco) || 0).toFixed(2)}</td>
                            <td>${p.quantidade ?? 0}</td>
                            <td><span class="badge-active">${window.escapeHtml(p.status)}</span></td>
                            <td><button class="btn-edit" onclick="editarProduto('${p._id}')"><i class="fas fa-edit"></i> Editar</button> <button class="btn-delete" onclick="excluirProduto('${p._id}')"><i class="fas fa-trash"></i> Excluir</button></td>
                        </tr>`;
                    }
                    html += '</tbody></table></div></div>';
                    document.getElementById('content').innerHTML = html;
                }
            } catch(e) { document.getElementById('content').innerHTML = '<div class="alert alert-danger">Erro ao carregar produtos</div>'; }
        }
        
        async function abrirModalProduto(produto = null) {
            await carregarCategoriasParaSelect();
            if (!produtoModal) produtoModal = new bootstrap.Modal(document.getElementById('produtoModal'));
            if (produto) {
                document.getElementById('produtoModalTitle').innerHTML = '<i class="fas fa-edit"></i> Editar Produto';
                document.getElementById('produtoId').value = produto._id;
                document.getElementById('prodNome').value = produto.nome;
                document.getElementById('prodSku').value = produto.sku;
                document.getElementById('prodPreco').value = produto.preco;
                document.getElementById('prodQuantidade').value = produto.quantidade;
                document.getElementById('prodCategoria').value = produto.categoria || '';
                document.getElementById('prodStatus').value = produto.status;
            } else {
                document.getElementById('produtoModalTitle').innerHTML = '<i class="fas fa-plus"></i> Novo Produto';
                document.getElementById('produtoId').value = '';
                document.getElementById('prodNome').value = '';
                document.getElementById('prodSku').value = '';
                document.getElementById('prodPreco').value = '';
                document.getElementById('prodQuantidade').value = 0;
                document.getElementById('prodCategoria').value = '';
                document.getElementById('prodStatus').value = 'ativo';
            }
            produtoModal.show();
        }
        
        async function editarProduto(id) {
            try {
                const res = await fetch(API + '/produtos/' + id, { headers: getHeaders() });
                const data = await res.json();
                if (data.success) abrirModalProduto(data.produto);
                else showToast('Erro ao carregar produto', true);
            } catch(e) { showToast('Erro ao carregar produto', true); }
        }
        
        async function salvarProduto() {
            const id = document.getElementById('produtoId').value;
            const categoria = document.getElementById('prodCategoria').value;
            
            if (!document.getElementById('prodNome').value.trim()) { showToast('Preencha o nome do produto!', true); return; }
            if (!document.getElementById('prodSku').value.trim()) { showToast('Preencha o SKU!', true); return; }
            if (!categoria) { showToast('Selecione uma categoria!', true); return; }
            
            const produto = {
                nome: document.getElementById('prodNome').value,
                sku: document.getElementById('prodSku').value,
                preco: parseFloat(document.getElementById('prodPreco').value) || 0,
                quantidade: parseInt(document.getElementById('prodQuantidade').value) || 0,
                categoria: categoria,
                status: document.getElementById('prodStatus').value
            };
            
            try {
                const url = id ? API + '/produtos/' + id : API + '/produtos';
                const method = id ? 'PUT' : 'POST';
                const res = await fetch(url, { method, headers: getHeaders(), body: JSON.stringify(produto) });
                const data = await res.json();
                if (data.success) {
                    produtoModal.hide();
                    showToast(id ? 'Produto atualizado!' : 'Produto criado!');
                    loadProdutos();
                } else showToast(data.message || 'Erro ao salvar', true);
            } catch(e) { showToast('Erro ao salvar', true); }
        }
        
        async function excluirProduto(id) { if (confirm('Excluir este produto?')) { try { await fetch(API + '/produtos/' + id, { method: 'DELETE', headers: getHeaders() }); showToast('Produto excluído!'); loadProdutos(); } catch(e) { showToast('Erro ao excluir', true); } } }
        
        // ==================== CATEGORIAS ====================
        async function loadCategorias() {
            document.getElementById('pageTitle').innerHTML = 'Categorias';
            document.getElementById('content').innerHTML = '<div class="text-center p-5"><div class="spinner-border text-primary"></div></div>';
            try {
                const res = await fetch(API + '/categorias', { headers: getHeaders() });
                const data = await res.json();
                if (data.success && data.categorias) {
                    let html = '<div class="data-card"><div class="d-flex justify-content-between mb-3"><h4>Categorias (' + data.categorias.length + ')</h4><button class="btn-primary-custom" onclick="abrirModalCategoria()"><i class="fas fa-plus"></i> Nova Categoria</button></div><div class="table-responsive"><table class="table table-dark"><thead><tr><th>Ícone</th><th>Nome</th><th>Slug</th><th>Status</th><th>Ações</th></tr></thead><tbody>';
                    for (const c of data.categorias) {
                        html += `<tr><td><i class="fas ${window.safeIcon(c.icone)} fa-lg"></i></td><td>${window.escapeHtml(c.nome)}</td><td>${window.escapeHtml(c.slug || '-')}</td><td><span class="badge-active">${window.escapeHtml(c.status)}</span></td><td><button class="btn-edit" onclick="editarCategoria('${c._id}')">Editar</button> <button class="btn-delete" onclick="excluirCategoria('${c._id}')">Excluir</button></td></tr>`;
                    }
                    html += '</tbody></table></div></div>';
                    document.getElementById('content').innerHTML = html;
                }
            } catch(e) { document.getElementById('content').innerHTML = '<div class="alert alert-danger">Erro ao carregar categorias</div>'; }
        }
        
        function abrirModalCategoria(categoria = null) {
            if (!categoriaModal) categoriaModal = new bootstrap.Modal(document.getElementById('categoriaModal'));
            if (categoria) {
                document.getElementById('categoriaModalTitle').innerHTML = '<i class="fas fa-edit"></i> Editar Categoria';
                document.getElementById('categoriaId').value = categoria._id;
                document.getElementById('catNome').value = categoria.nome;
                document.getElementById('catIcone').value = categoria.icone || 'fa-microchip';
                document.getElementById('catStatus').value = categoria.status;
            } else {
                document.getElementById('categoriaModalTitle').innerHTML = '<i class="fas fa-plus"></i> Nova Categoria';
                document.getElementById('categoriaId').value = '';
                document.getElementById('catNome').value = '';
                document.getElementById('catIcone').value = 'fa-microchip';
                document.getElementById('catStatus').value = 'ativo';
            }
            categoriaModal.show();
        }
        
        async function editarCategoria(id) { try { const res = await fetch(API + '/categorias/' + id, { headers: getHeaders() }); const data = await res.json(); if (data.success) abrirModalCategoria(data.categoria); else showToast('Erro ao carregar categoria', true); } catch(e) { showToast('Erro ao carregar categoria', true); } }
        
        async function salvarCategoria() {
            const id = document.getElementById('categoriaId').value;
            const nome = document.getElementById('catNome').value.trim();
            if (!nome) { showToast('Preencha o nome da categoria!', true); return; }
            const categoria = {
                nome: nome,
                icone: document.getElementById('catIcone').value,
                status: document.getElementById('catStatus').value,
                slug: nome.toLowerCase().replace(/[^a-z0-9]/g, '-')
            };
            try {
                const url = id ? API + '/categorias/' + id : API + '/categorias';
                const method = id ? 'PUT' : 'POST';
                const res = await fetch(url, { method, headers: getHeaders(), body: JSON.stringify(categoria) });
                const data = await res.json();
                if (data.success) {
                    categoriaModal.hide();
                    showToast(id ? 'Categoria atualizada!' : 'Categoria criada!');
                    loadCategorias();
                    carregarCategoriasParaSelect(); // atualizar select dos produtos
                } else showToast(data.message || 'Erro ao salvar', true);
            } catch(e) { showToast('Erro ao salvar', true); }
        }
        
        async function excluirCategoria(id) { if (confirm('Excluir esta categoria? Produtos vinculados perderão a referência.')) { try { await fetch(API + '/categorias/' + id, { method: 'DELETE', headers: getHeaders() }); showToast('Categoria excluída!'); loadCategorias(); carregarCategoriasParaSelect(); } catch(e) { showToast('Erro ao excluir', true); } } }
        
        // ==================== PEDIDOS ====================
        async function loadPedidos() {
            document.getElementById('pageTitle').innerHTML = 'Pedidos';
            document.getElementById('content').innerHTML = '<div class="text-center p-5"><div class="spinner-border text-primary"></div></div>';
            try {
                const res = await fetch(API + '/pedidos', { headers: getHeaders() });
                const data = await res.json();
                if (data.success && data.pedidos && data.pedidos.length > 0) {
                    let html = '<div class="data-card"><h4>Pedidos (' + data.pedidos.length + ')</h4><div class="table-responsive"><table class="table table-dark"><thead><tr><th>Nº</th><th>Cliente</th><th>Data</th><th>Total</th><th>Status</th><th>Ações</th></tr></thead><tbody>';
                    for (const p of data.pedidos) {
                        const statusClass = getStatusClass(p.status);
                        const statusText = getStatusText(p.status);
                        html += `<tr>
                            <td><strong>${window.escapeHtml(p.numero)}</strong></td>
                            <td>${window.escapeHtml(p.cliente?.nome || '-')}<br><small>${window.escapeHtml(p.cliente?.email || '-')}</small></td>
                            <td>${new Date(p.createdAt).toLocaleDateString()}</td>
                            <td><strong>R$ ${(Number(p.total) || 0).toFixed(2)}</strong></td>
                            <td><span class="${statusClass}">${statusText}</span></td>
                            <td><button class="btn-view" onclick="verPedidoDetalhes('${p._id}')"><i class="fas fa-eye"></i> Ver</button>
                                <button class="btn-status" onclick="abrirModalStatus('${p._id}', '${(p.status || '').replace(/[^a-z]/g, '')}')"><i class="fas fa-exchange-alt"></i> Status</button></td>
                        </tr>`;
                    }
                    html += '</tbody></table></div></div>';
                    document.getElementById('content').innerHTML = html;
                } else { document.getElementById('content').innerHTML = '<div class="data-card"><p>Nenhum pedido encontrado.</p></div>'; }
            } catch(e) { document.getElementById('content').innerHTML = '<div class="alert alert-danger">Erro ao carregar pedidos</div>'; }
        }
        
        window.verPedidoDetalhes = async function(id) {
            try {
                const res = await fetch(API + '/pedidos/' + id, { headers: getHeaders() });
                const data = await res.json();
                if (data.success && data.pedido) {
                    const p = data.pedido;
                    let itensHtml = '';
                    for (const item of (p.items || [])) { const nm = window.escapeHtml(item.nome ?? item.name ?? '-'); const q = Number(item.quantity) || 0; const pr = Number(item.preco ?? item.price) || 0; itensHtml += `<tr><td>${nm}</td><td>${q}</td><td>R$ ${pr.toFixed(2)}</td><td>R$ ${(pr * q).toFixed(2)}</td>`; }
                    document.getElementById('pedidoDetalhesBody').innerHTML = `
                        <div class="row"><div class="col-md-6"><h6><i class="fas fa-user"></i> Dados do Cliente</h6><p><strong>Nome:</strong> ${window.escapeHtml(p.cliente?.nome || '-')}<br><strong>Email:</strong> ${window.escapeHtml(p.cliente?.email || '-')}<br><strong>Telefone:</strong> ${window.escapeHtml(p.cliente?.telefone || '-')}<br><strong>CPF:</strong> ${window.escapeHtml(p.cliente?.cpf || '-')}</p></div>
                        <div class="col-md-6"><h6><i class="fas fa-map-marker-alt"></i> Endereço de Entrega</h6><p>${window.escapeHtml(p.endereco?.logradouro || '-')}, ${window.escapeHtml(p.endereco?.numero || '-')}<br>${window.escapeHtml(p.endereco?.bairro || '-')}<br>${window.escapeHtml(p.endereco?.cidade || '-')} - ${window.escapeHtml(p.endereco?.estado || '-')}<br>CEP: ${window.escapeHtml(p.endereco?.cep || '-')}</p></div></div><hr>
                        <h6><i class="fas fa-boxes"></i> Itens do Pedido</h6><div class="table-responsive"><table class="table table-dark table-sm"><thead><tr><th>Produto</th><th>Qtd</th><th>Preço</th><th>Subtotal</th></tr></thead><tbody>${itensHtml}</tbody>
                        <tfoot><tr><td colspan="3" class="text-end"><strong>Subtotal:</strong></td><td>R$ ${(Number(p.subtotal) || 0).toFixed(2)}</td></tr>
                        <tr><td colspan="3" class="text-end"><strong>Frete:</strong></td><td>${(Number(p.frete) || 0) === 0 ? 'Grátis' : 'R$ ' + (Number(p.frete) || 0).toFixed(2)}</td></tr>
                        ${Number(p.desconto) > 0 ? '<tr><td colspan="3" class="text-end"><strong>Desconto:</strong></td><td class="text-success">- R$ ' + (Number(p.desconto) || 0).toFixed(2) + '</td></tr>' : ''}
                        <tr><td colspan="3" class="text-end"><strong>TOTAL:</strong></td><td><strong class="text-primary">R$ ${(Number(p.total) || 0).toFixed(2)}</strong></td></tr></tfoot></table></div><hr>
                        <div class="row"><div class="col-md-6"><strong><i class="fas fa-credit-card"></i> Pagamento:</strong> ${p.pagamento === 'pix' ? 'PIX' : p.pagamento === 'card' ? 'Cartão' : 'Boleto'}</div>
                        <div class="col-md-6"><strong><i class="fas fa-toggle-on"></i> Status:</strong> <span class="${getStatusClass(p.status)}">${getStatusText(p.status)}</span></div></div>
                        <div class="mt-3"><strong><i class="fas fa-calendar"></i> Data:</strong> ${new Date(p.createdAt).toLocaleString()}</div>`;
                    if (!pedidoModal) pedidoModal = new bootstrap.Modal(document.getElementById('pedidoModal'));
                    pedidoModal.show();
                } else { showToast('Erro ao carregar detalhes', true); }
            } catch(e) { showToast('Erro ao carregar detalhes', true); }
        };
        
        window.abrirModalStatus = function(id, statusAtual) {
            pedidoAtualId = id;
            if (!statusModal) statusModal = new bootstrap.Modal(document.getElementById('statusModal'));
            document.getElementById('statusSelecionado').value = statusAtual;
            statusModal.show();
        };
        
        window.atualizarStatusPedido = async function() {
            const novoStatus = document.getElementById('statusSelecionado').value;
            try {
                const res = await fetch(API + '/pedidos/' + pedidoAtualId + '/status', { method: 'PUT', headers: getHeaders(), body: JSON.stringify({ status: novoStatus }) });
                const data = await res.json();
                if (data.success) { statusModal.hide(); showToast('Status atualizado para: ' + getStatusText(novoStatus)); loadPedidos(); }
                else { showToast('Erro ao atualizar status', true); }
            } catch(e) { showToast('Erro ao atualizar status', true); }
        };
        
        // ==================== CLIENTES ====================
        async function loadClientes() {
            document.getElementById('pageTitle').innerHTML = 'Clientes';
            document.getElementById('content').innerHTML = '<div class="text-center p-5"><div class="spinner-border text-primary"></div></div>';
            try {
                const res = await fetch(API + '/clientes', { headers: getHeaders() });
                const data = await res.json();
                if (data.success && data.clientes && data.clientes.length > 0) {
                    let html = '<div class="data-card"><h4>Clientes (' + data.clientes.length + ')</h4><div class="table-responsive"><table class="table table-dark"><thead><tr><th>Nome</th><th>Email</th><th>Telefone</th><th>Cadastro</th><th>Status</th></tr></thead><tbody>';
                    for (const c of data.clientes) { html += `<tr><td>${window.escapeHtml(c.nome || '-')}</td><td>${window.escapeHtml(c.email || '-')}</td><td>${window.escapeHtml(c.telefone || '-')}</td><td>${c.createdAt ? new Date(c.createdAt).toLocaleDateString() : '-'}</td><td><span class="badge-active">${window.escapeHtml(c.status)}</span></td></tr>`; }
                    html += '</tbody></table></div></div>';
                    document.getElementById('content').innerHTML = html;
                }
            } catch(e) { document.getElementById('content').innerHTML = '<div class="alert alert-danger">Erro ao carregar clientes</div>'; }
        }
        
        loadDashboard();
    </script>
</body>
</html>
