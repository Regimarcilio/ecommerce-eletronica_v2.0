<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | TechStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body { background: #0a0a0f; color: #e0e0e0; font-family: 'Segoe UI', sans-serif; }
        .sidebar { position: fixed; left: 0; top: 0; width: 260px; height: 100%; background: #0d1117; border-right: 1px solid #1f2937; padding: 20px; }
        .content { margin-left: 280px; padding: 20px; }
        .menu-item { display: block; padding: 12px 16px; color: #9ca3af; margin: 5px 0; border-radius: 10px; cursor: pointer; }
        .menu-item:hover, .menu-item.active { background: #4361ee; color: #fff; }
        .stat-card { background: #0d1117; border: 1px solid #1f2937; border-radius: 12px; padding: 20px; text-align: center; margin-bottom: 20px; }
        .stat-value { font-size: 2rem; font-weight: 700; color: #4361ee; }
        .data-card { background: #0d1117; border: 1px solid #1f2937; border-radius: 12px; padding: 20px; margin-top: 20px; }
        .btn-primary-custom { background: linear-gradient(135deg, #4361ee, #3a0ca3); border: none; color: #fff; padding: 8px 18px; border-radius: 8px; cursor: pointer; }
        .btn-edit { background: #0f172a; border: 1px solid #f59e0b; color: #f59e0b; padding: 5px 12px; border-radius: 6px; cursor: pointer; margin-right: 5px; }
        .btn-delete { background: #0f172a; border: 1px solid #ef4444; color: #ef4444; padding: 5px 12px; border-radius: 6px; cursor: pointer; }
        .table-dark { background: #0d1117; width: 100%; border-collapse: collapse; }
        .table-dark th, .table-dark td { padding: 10px; text-align: left; border-bottom: 1px solid #1f2937; }
        .badge-active { background: #10b98120; color: #10b981; padding: 4px 10px; border-radius: 20px; display: inline-block; }
        .badge-inactive { background: #ef444420; color: #ef4444; padding: 4px 10px; border-radius: 20px; display: inline-block; }
        .modal-content { background: #0d1117; border: 1px solid #1f2937; }
        .form-control { background: #0a0a0f; border: 1px solid #1f2937; color: #fff; padding: 8px 12px; border-radius: 6px; width: 100%; }
        .form-control:focus { background: #0a0a0f; border-color: #4361ee; outline: none; }
        .toast-custom { position: fixed; bottom: 20px; right: 20px; background: #0d1117; border-left: 3px solid #10b981; color: #10b981; padding: 10px 20px; border-radius: 8px; z-index: 9999; font-size: 14px; }
        .toast-error { border-left-color: #ef4444; color: #ef4444; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h3><i class="bi bi-cpu"></i> TechStore</h3>
        <div class="menu-item active" data-page="dashboard">Dashboard</div>
        <div class="menu-item" data-page="produtos">Produtos</div>
        <div class="menu-item" data-page="categorias">Categorias</div>
        <div class="menu-item" data-page="pedidos">Pedidos</div>
        <div class="menu-item" data-page="clientes">Clientes</div>
        <div class="menu-item mt-5" id="logoutBtn">Sair</div>
    </div>
    
    <div class="content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 id="pageTitle">Dashboard</h2>
            <span id="userName"></span>
        </div>
        <div id="content"></div>
    </div>

    <!-- Modal Produto -->
    <div class="modal fade" id="produtoModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="produtoModalTitle">Produto</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="produtoId">
                    <div class="mb-2"><label>Nome</label><input type="text" id="prodNome" class="form-control"></div>
                    <div class="mb-2"><label>SKU</label><input type="text" id="prodSku" class="form-control"></div>
                    <div class="mb-2"><label>Preço</label><input type="number" step="0.01" id="prodPreco" class="form-control"></div>
                    <div class="mb-2"><label>Quantidade</label><input type="number" id="prodQuantidade" class="form-control"></div>
                    <div class="mb-2"><label>Status</label><select id="prodStatus" class="form-control"><option value="ativo">Ativo</option><option value="inativo">Inativo</option></select></div>
                    <div class="mb-2"><label>Descrição</label><textarea id="prodDesc" class="form-control" rows="2"></textarea></div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button class="btn btn-primary-custom" id="salvarProdutoBtn">Salvar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Categoria -->
    <div class="modal fade" id="categoriaModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="categoriaModalTitle">Categoria</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="categoriaId">
                    <div class="mb-2"><label>Nome</label><input type="text" id="catNome" class="form-control"></div>
                    <div class="mb-2"><label>Ícone</label><input type="text" id="catIcone" class="form-control" value="bi-folder"></div>
                    <div class="mb-2"><label>Status</label><select id="catStatus" class="form-control"><option value="ativo">Ativo</option><option value="inativo">Inativo</option></select></div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button class="btn btn-primary-custom" id="salvarCategoriaBtn">Salvar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API = 'http://localhost:5000/api';
        const token = localStorage.getItem('token');
        const user = JSON.parse(localStorage.getItem('user') || '{}');
        
        if (!token || user.role !== 'admin') {
            window.location.href = '/auth.html';
        }
        
        document.getElementById('userName').innerHTML = '<i class="bi bi-person-circle"></i> ' + user.nome;
        
        let produtoModal, categoriaModal;
        
        function showToast(msg, isError) {
            var toast = document.createElement('div');
            toast.className = 'toast-custom';
            if (isError) toast.classList.add('toast-error');
            toast.innerHTML = msg;
            document.body.appendChild(toast);
            setTimeout(function() { toast.remove(); }, 3000);
        }
        
        function logout() {
            localStorage.clear();
            window.location.href = '/auth.html';
        }
        
        // Dashboard
        async function loadDashboard() {
            document.getElementById('pageTitle').innerHTML = 'Dashboard';
            document.getElementById('content').innerHTML = '<div class="text-center p-5">Carregando...</div>';
            try {
                var res = await fetch(API + '/dashboard/stats');
                var data = await res.json();
                if (data.success) {
                    var s = data.stats;
                    document.getElementById('content').innerHTML = `
                        <div class="row">
                            <div class="col-md-3"><div class="stat-card"><i class="bi bi-box fs-1"></i><div class="stat-value">${s.totalProdutos || 0}</div><div>Produtos</div></div></div>
                            <div class="col-md-3"><div class="stat-card"><i class="bi bi-tags fs-1"></i><div class="stat-value">${s.totalCategorias || 0}</div><div>Categorias</div></div></div>
                            <div class="col-md-3"><div class="stat-card"><i class="bi bi-people fs-1"></i><div class="stat-value">${s.totalClientes || 0}</div><div>Clientes</div></div></div>
                            <div class="col-md-3"><div class="stat-card"><i class="bi bi-cart fs-1"></i><div class="stat-value">${s.totalPedidos || 0}</div><div>Pedidos</div></div></div>
                        </div>
                        <div class="row"><div class="col-md-12"><div class="stat-card"><i class="bi bi-currency-dollar fs-1"></i><div class="stat-value">R$ ${(s.vendasTotal || 0).toFixed(2)}</div><div>Faturamento</div></div></div></div>
                    `;
                }
            } catch(e) {
                document.getElementById('content').innerHTML = '<div class="alert alert-danger">Erro ao carregar dashboard</div>';
            }
        }
        
        // Produtos
        async function loadProdutos() {
            document.getElementById('pageTitle').innerHTML = 'Produtos';
            document.getElementById('content').innerHTML = '<div class="text-center p-5">Carregando...</div>';
            try {
                var res = await fetch(API + '/produtos');
                var data = await res.json();
                if (data.success && data.produtos) {
                    var html = '<div class="data-card"><div class="d-flex justify-content-between mb-3"><h4>Produtos (' + data.produtos.length + ')</h4><button class="btn-primary-custom" onclick="abrirModalProduto()">+ Novo Produto</button></div><div style="overflow-x:auto;"><table class="table-dark" style="width:100%"><thead><tr><th>Nome</th><th>SKU</th><th>Preço</th><th>Estoque</th><th>Status</th><th>Ações</th></tr></thead><tbody>';
                    for (var i = 0; i < data.produtos.length; i++) {
                        var p = data.produtos[i];
                        html += '<tr><td>' + p.nome + '</td><td>' + p.sku + '</td><td>R$ ' + p.preco + '</td><td>' + p.quantidade + '</td><td><span class="' + (p.status === 'ativo' ? 'badge-active' : 'badge-inactive') + '">' + p.status + '</span></td><td><button class="btn-edit" onclick="editarProduto(\'' + p._id + '\')">Editar</button> <button class="btn-delete" onclick="excluirProduto(\'' + p._id + '\')">Excluir</button></td></tr>';
                    }
                    html += '</tbody></table></div></div>';
                    document.getElementById('content').innerHTML = html;
                }
            } catch(e) {
                document.getElementById('content').innerHTML = '<div class="alert alert-danger">Erro</div>';
            }
        }
        
        window.abrirModalProduto = function(produto) {
            if (!produtoModal) produtoModal = new bootstrap.Modal(document.getElementById('produtoModal'));
            if (produto) {
                document.getElementById('produtoModalTitle').innerText = 'Editar Produto';
                document.getElementById('produtoId').value = produto._id || '';
                document.getElementById('prodNome').value = produto.nome || '';
                document.getElementById('prodSku').value = produto.sku || '';
                document.getElementById('prodPreco').value = produto.preco || '';
                document.getElementById('prodQuantidade').value = produto.quantidade || 0;
                document.getElementById('prodStatus').value = produto.status || 'ativo';
                document.getElementById('prodDesc').value = produto.descricaoCurta || '';
            } else {
                document.getElementById('produtoModalTitle').innerText = 'Novo Produto';
                document.getElementById('produtoId').value = '';
                document.getElementById('prodNome').value = '';
                document.getElementById('prodSku').value = '';
                document.getElementById('prodPreco').value = '';
                document.getElementById('prodQuantidade').value = 0;
                document.getElementById('prodStatus').value = 'ativo';
                document.getElementById('prodDesc').value = '';
            }
            produtoModal.show();
        };
        
        window.editarProduto = async function(id) {
            try {
                showToast('Carregando produto...', false);
                var res = await fetch(API + '/produtos/' + id);
                var data = await res.json();
                if (data.success && data.produto) {
                    window.abrirModalProduto(data.produto);
                    showToast('Produto carregado!', false);
                } else {
                    showToast('Erro ao carregar produto', true);
                }
            } catch(e) {
                showToast('Erro: ' + e.message, true);
            }
        };
        
        window.salvarProduto = async function() {
            var id = document.getElementById('produtoId').value;
            var produto = {
                nome: document.getElementById('prodNome').value,
                sku: document.getElementById('prodSku').value,
                preco: parseFloat(document.getElementById('prodPreco').value),
                quantidade: parseInt(document.getElementById('prodQuantidade').value),
                status: document.getElementById('prodStatus').value,
                descricaoCurta: document.getElementById('prodDesc').value
            };
            
            if (!produto.nome || !produto.sku) {
                showToast('Preencha nome e SKU!', true);
                return;
            }
            
            try {
                var url = id ? API + '/produtos/' + id : API + '/produtos';
                var method = id ? 'PUT' : 'POST';
                var res = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(produto)
                });
                var data = await res.json();
                if (data.success) {
                    produtoModal.hide();
                    showToast(id ? 'Produto atualizado!' : 'Produto criado!', false);
                    loadProdutos();
                } else {
                    showToast(data.message || 'Erro ao salvar', true);
                }
            } catch(e) {
                showToast('Erro ao salvar', true);
            }
        };
        
        window.excluirProduto = async function(id) {
            if (confirm('Excluir este produto?')) {
                try {
                    var res = await fetch(API + '/produtos/' + id, { method: 'DELETE' });
                    var data = await res.json();
                    if (data.success) {
                        showToast('Produto excluido!', false);
                        loadProdutos();
                    } else {
                        showToast(data.message || 'Erro ao excluir', true);
                    }
                } catch(e) {
                    showToast('Erro ao excluir', true);
                }
            }
        };
        
        // Categorias
        async function loadCategorias() {
            document.getElementById('pageTitle').innerHTML = 'Categorias';
            document.getElementById('content').innerHTML = '<div class="text-center p-5">Carregando...</div>';
            try {
                var res = await fetch(API + '/categorias');
                var data = await res.json();
                if (data.success && data.categorias) {
                    var html = '<div class="data-card"><div class="d-flex justify-content-between mb-3"><h4>Categorias (' + data.categorias.length + ')</h4><button class="btn-primary-custom" onclick="abrirModalCategoria()">+ Nova Categoria</button></div><div style="overflow-x:auto;"><table class="table-dark" style="width:100%"><thead><tr><th>Icone</th><th>Nome</th><th>Slug</th><th>Status</th><th>Ações</th></tr></thead><tbody>';
                    for (var i = 0; i < data.categorias.length; i++) {
                        var c = data.categorias[i];
                        html += '<tr><td><i class="bi ' + (c.icone || 'bi-folder') + '"></i></td><td>' + c.nome + '</td><td>' + c.slug + '</td><td><span class="' + (c.status === 'ativo' ? 'badge-active' : 'badge-inactive') + '">' + c.status + '</span></td><td><button class="btn-edit" onclick="editarCategoria(\'' + c._id + '\')">Editar</button> <button class="btn-delete" onclick="excluirCategoria(\'' + c._id + '\')">Excluir</button></td></tr>';
                    }
                    html += '</tbody></table></div></div>';
                    document.getElementById('content').innerHTML = html;
                }
            } catch(e) {
                document.getElementById('content').innerHTML = '<div class="alert alert-danger">Erro</div>';
            }
        }
        
        window.abrirModalCategoria = function(categoria) {
            if (!categoriaModal) categoriaModal = new bootstrap.Modal(document.getElementById('categoriaModal'));
            if (categoria) {
                document.getElementById('categoriaModalTitle').innerText = 'Editar Categoria';
                document.getElementById('categoriaId').value = categoria._id || '';
                document.getElementById('catNome').value = categoria.nome || '';
                document.getElementById('catIcone').value = categoria.icone || 'bi-folder';
                document.getElementById('catStatus').value = categoria.status || 'ativo';
            } else {
                document.getElementById('categoriaModalTitle').innerText = 'Nova Categoria';
                document.getElementById('categoriaId').value = '';
                document.getElementById('catNome').value = '';
                document.getElementById('catIcone').value = 'bi-folder';
                document.getElementById('catStatus').value = 'ativo';
            }
            categoriaModal.show();
        };
        
        window.editarCategoria = async function(id) {
            try {
                var res = await fetch(API + '/categorias/' + id);
                var data = await res.json();
                if (data.success && data.categoria) {
                    window.abrirModalCategoria(data.categoria);
                    showToast('Categoria carregada!', false);
                } else {
                    showToast('Erro ao carregar categoria', true);
                }
            } catch(e) {
                showToast('Erro ao carregar', true);
            }
        };
        
        window.salvarCategoria = async function() {
            var id = document.getElementById('categoriaId').value;
            var nome = document.getElementById('catNome').value;
            if (!nome) {
                showToast('Preencha o nome!', true);
                return;
            }
            var categoria = {
                nome: nome,
                icone: document.getElementById('catIcone').value,
                status: document.getElementById('catStatus').value,
                slug: nome.toLowerCase().replace(/ /g, '-')
            };
            try {
                var url = id ? API + '/categorias/' + id : API + '/categorias';
                var method = id ? 'PUT' : 'POST';
                var res = await fetch(url, { method: method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(categoria) });
                var data = await res.json();
                if (data.success) {
                    categoriaModal.hide();
                    showToast(id ? 'Categoria atualizada!' : 'Categoria criada!', false);
                    loadCategorias();
                } else {
                    showToast(data.message || 'Erro ao salvar', true);
                }
            } catch(e) {
                showToast('Erro ao salvar', true);
            }
        };
        
        window.excluirCategoria = async function(id) {
            if (confirm('Excluir categoria?')) {
                try {
                    var res = await fetch(API + '/categorias/' + id, { method: 'DELETE' });
                    var data = await res.json();
                    if (data.success) {
                        showToast('Categoria excluida!', false);
                        loadCategorias();
                    } else {
                        showToast(data.message || 'Erro ao excluir', true);
                    }
                } catch(e) {
                    showToast('Erro ao excluir', true);
                }
            }
        };
        
        // Pedidos
        async function loadPedidos() {
            document.getElementById('pageTitle').innerHTML = 'Pedidos';
            document.getElementById('content').innerHTML = '<div class="text-center p-5">Carregando...</div>';
            try {
                var res = await fetch(API + '/pedidos');
                var data = await res.json();
                if (data.success && data.pedidos && data.pedidos.length > 0) {
                    var html = '<div class="data-card"><h4>Pedidos (' + data.pedidos.length + ')</h4><div style="overflow-x:auto;"><table class="table-dark" style="width:100%"><thead><tr><th>Numero</th><th>Cliente</th><th>Data</th><th>Total</th><th>Status</th></tr></thead><tbody>';
                    for (var i = 0; i < data.pedidos.length; i++) {
                        var p = data.pedidos[i];
                        html += '<tr><td>' + p.numero + '</td><td>' + p.cliente.nome + '<br><small>' + p.cliente.email + '</small></td><td>' + new Date(p.createdAt).toLocaleDateString() + '</td><td>R$ ' + p.total.toFixed(2) + '</td><td><span class="badge-active">' + p.status + '</span></td></tr>';
                    }
                    html += '</tbody></table></div></div>';
                    document.getElementById('content').innerHTML = html;
                } else {
                    document.getElementById('content').innerHTML = '<div class="data-card"><p>Nenhum pedido encontrado.</p></div>';
                }
            } catch(e) {
                document.getElementById('content').innerHTML = '<div class="alert alert-danger">Erro ao carregar pedidos</div>';
            }
        }
        
        // Clientes
        async function loadClientes() {
            document.getElementById('pageTitle').innerHTML = 'Clientes';
            document.getElementById('content').innerHTML = '<div class="text-center p-5">Carregando...</div>';
            try {
                var res = await fetch(API + '/clientes');
                var data = await res.json();
                if (data.success && data.clientes && data.clientes.length > 0) {
                    var html = '<div class="data-card"><h4>Clientes (' + data.clientes.length + ')</h4><div style="overflow-x:auto;"><table class="table-dark" style="width:100%"><thead><tr><th>Nome</th><th>Email</th><th>Telefone</th><th>Cadastro</th><th>Status</th></tr></thead><tbody>';
                    for (var i = 0; i < data.clientes.length; i++) {
                        var c = data.clientes[i];
                        html += '<tr><td>' + (c.nome || '-') + '</td><td>' + (c.email || '-') + '</td><td>' + (c.telefone || '-') + '</td><td>' + new Date(c.createdAt).toLocaleDateString() + '</td><td><span class="' + (c.status === 'ativo' ? 'badge-active' : 'badge-inactive') + '">' + c.status + '</span></td></tr>';
                    }
                    html += '</tbody></table></div></div>';
                    document.getElementById('content').innerHTML = html;
                } else {
                    document.getElementById('content').innerHTML = '<div class="data-card"><p>Nenhum cliente encontrado.</p></div>';
                }
            } catch(e) {
                document.getElementById('content').innerHTML = '<div class="alert alert-danger">Erro ao carregar clientes</div>';
            }
        }
        
        // Navegacao
        function navigateTo(page) {
            var items = document.querySelectorAll('.menu-item');
            for (var i = 0; i < items.length; i++) {
                items[i].classList.remove('active');
                if (items[i].dataset.page === page) items[i].classList.add('active');
            }
            if (page === 'dashboard') loadDashboard();
            else if (page === 'produtos') loadProdutos();
            else if (page === 'categorias') loadCategorias();
            else if (page === 'pedidos') loadPedidos();
            else if (page === 'clientes') loadClientes();
        }
        
        // Eventos
        var menuItems = document.querySelectorAll('.menu-item');
        for (var i = 0; i < menuItems.length; i++) {
            if (menuItems[i].dataset.page) {
                menuItems[i].addEventListener('click', (function(page) {
                    return function() { navigateTo(page); };
                })(menuItems[i].dataset.page));
            }
        }
        document.getElementById('logoutBtn').addEventListener('click', logout);
        document.getElementById('salvarProdutoBtn').addEventListener('click', function() { window.salvarProduto(); });
        document.getElementById('salvarCategoriaBtn').addEventListener('click', function() { window.salvarCategoria(); });
        
        // Iniciar
        navigateTo('dashboard');
    </script>
</body>
</html>
