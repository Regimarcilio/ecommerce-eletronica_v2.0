<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | PlacaCerta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root{
            --bg:#0a0e1a; --bg2:#0e1428; --card:#131b36; --card2:#182242;
            --line:rgba(255,255,255,.09);
            --amber:#ffb224; --amber2:#ff8a00; --cyan:#38e1ff;
            --txt:#f2f5ff; --mut:#9aa4c7;
            --grad:linear-gradient(120deg,#ffb224,#ff8a00 55%,#ff5e3a);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); color: var(--txt); font-family: 'Inter', system-ui, sans-serif; }
        h1, h2, h3, h4, h5 { font-family: 'Space Grotesk', sans-serif; }
        .sidebar { position: fixed; left: 0; top: 0; width: 280px; height: 100%; background: var(--bg2); border-right: 1px solid var(--line); padding: 20px; overflow-y: auto; }
        .sidebar h3 { margin-bottom: 30px; text-align: center; font-size: 1.35rem; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .sidebar h3 .bolt { width: 34px; height: 34px; border-radius: 10px; background: var(--grad); display: inline-grid; place-items: center; color: #1a1000; font-size: 1rem; }
        .sidebar h3 em { font-style: normal; background: var(--grad); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
        .sidebar .menu-item { display: block; padding: 12px 16px; color: var(--mut); margin: 5px 0; border-radius: 12px; cursor: pointer; transition: all 0.25s; font-size: .92rem; }
        .sidebar .menu-item:hover { background: rgba(255,178,36,.1); color: var(--txt); }
        .sidebar .menu-item.active { background: var(--grad); color: #1a1000; font-weight: 600; }
        .sidebar .menu-item i { margin-right: 12px; width: 25px; }
        .main-content { margin-left: 300px; padding: 20px; }
        .top-bar { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 15px 25px; margin-bottom: 25px; display: flex; justify-content: space-between; align-items: center; }
        .logout-btn { background: transparent; border: 1px solid rgba(248,113,113,.5); color: #f87171; padding: 8px 20px; border-radius: 999px; cursor: pointer; transition: all .25s; }
        .logout-btn:hover { background: #ef4444; border-color: #ef4444; color: #fff; }
        .stat-card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 22px; text-align: center; transition: all 0.25s; }
        .stat-card:hover { transform: translateY(-3px); border-color: rgba(255,178,36,.5); }
        .stat-value { font-family: 'Space Grotesk'; font-size: 2.1rem; font-weight: 700; color: var(--amber); margin-top: 10px; }
        .stat-card small, .stat-card .text-muted { color: var(--mut) !important; }
        .data-card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 22px; margin-top: 20px; }
        .data-card h4 { font-size: 1.1rem; }
        .btn-primary-custom { background: var(--grad); border: none; color: #1a1000; font-weight: 600; padding: 9px 22px; border-radius: 999px; cursor: pointer; transition: all 0.25s; }
        .btn-primary-custom:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(255,138,0,.45); color: #1a1000; }
        .btn-secondary-custom { background: #1f2937; border: none; color: #fff; padding: 8px 20px; border-radius: 999px; cursor: pointer; transition: all 0.3s; }
        .btn-secondary-custom:hover { background: #374151; }
        .btn-edit { background: transparent; border: 1px solid rgba(255,178,36,.55); color: var(--amber); padding: 5px 12px; border-radius: 8px; cursor: pointer; margin-right: 5px; transition: all .2s; }
        .btn-edit:hover { background: var(--amber); color: #1a1000; }
        .btn-delete { background: transparent; border: 1px solid rgba(248,113,113,.55); color: #f87171; padding: 5px 12px; border-radius: 8px; cursor: pointer; transition: all .2s; }
        .btn-delete:hover { background: #ef4444; color: #fff; }
        .btn-view { background: transparent; border: 1px solid rgba(56,225,255,.55); color: var(--cyan); padding: 5px 12px; border-radius: 8px; cursor: pointer; transition: all .2s; }
        .btn-view:hover { background: var(--cyan); color: #0a0e1a; }
        .btn-status { background: transparent; border: 1px solid rgba(167,139,250,.55); color: #c4b5fd; padding: 5px 12px; border-radius: 8px; cursor: pointer; margin-left: 5px; transition: all .2s; }
        .btn-status:hover { background: #a78bfa; color: #0a0e1a; }
        .btn-new-cat { background: transparent; border: 1px solid rgba(110,231,183,.55); color: #6ee7b7; padding: 5px 12px; border-radius: 8px; cursor: pointer; margin-left: 10px; font-size: 12px; transition: all .2s; }
        .btn-new-cat:hover { background: #6ee7b7; color: #0a0e1a; }
        .table-responsive { overflow-x: auto; }
        .table-dark { --bs-table-bg: transparent; background: transparent; color: var(--txt); }
        .table-dark th { border-bottom: 1px solid var(--line); color: var(--mut); font-weight: 600; font-size: .75rem; text-transform: uppercase; letter-spacing: 1px; padding: 12px; }
        .table-dark td { padding: 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
        .table-dark tr:hover { background: rgba(255,255,255,.03); }
        .badge-active { background: rgba(110,231,183,.12); color: #6ee7b7; padding: 4px 12px; border-radius: 20px; font-size: 12px; border: 1px solid rgba(110,231,183,.4); }
        .badge-warning { background: rgba(255,178,36,.12); color: var(--amber); padding: 4px 12px; border-radius: 20px; font-size: 12px; border: 1px solid rgba(255,178,36,.4); }
        .badge-info { background: rgba(56,225,255,.12); color: var(--cyan); padding: 4px 12px; border-radius: 20px; font-size: 12px; border: 1px solid rgba(56,225,255,.4); }
        .badge-success { background: rgba(110,231,183,.12); color: #6ee7b7; padding: 4px 12px; border-radius: 20px; font-size: 12px; border: 1px solid rgba(110,231,183,.4); }
        .badge-tipo { display: inline-block; font-size: .7rem; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; padding: 3px 12px; border-radius: 20px; }
        .badge-PRINCIPAL { background: rgba(56,225,255,.12); color: var(--cyan); border: 1px solid rgba(56,225,255,.4); }
        .badge-FONTE { background: rgba(255,178,36,.12); color: var(--amber); border: 1px solid rgba(255,178,36,.4); }
        .badge-TCOM { background: rgba(167,139,250,.14); color: #c4b5fd; border: 1px solid rgba(167,139,250,.4); }
        .compat-cell { display: block; font-size: .76rem; color: var(--cyan); margin-top: 2px; }
        .modal-content { background: var(--card); border: 1px solid var(--line); border-radius: 22px; color: var(--txt); }
        .modal-header { border-bottom-color: var(--line); }
        .modal-footer { border-top-color: var(--line); }
        .btn-close-white { filter: brightness(0) invert(1); }
        .modal-body .form-label { font-size: .72rem; font-weight: 600; letter-spacing: 1.2px; text-transform: uppercase; color: var(--mut); }
        .form-control, .form-select { background: #0b1128; border: 1px solid var(--line); color: var(--txt); padding: 11px 14px; border-radius: 12px; }
        .form-control:focus, .form-select:focus { background: #0b1128; color: var(--txt); border-color: var(--amber); box-shadow: 0 0 0 3px rgba(255,178,36,.15); outline: none; }
        .form-control::placeholder { color: #5b6589; }
        .form-check-input:checked { background-color: var(--amber2); border-color: var(--amber2); }
        .text-muted { color: var(--mut) !important; }
        small.text-muted { color: var(--mut) !important; }
        .toast-custom { position: fixed; bottom: 20px; right: 20px; background: #0d1330; border: 1px solid var(--line); border-left: 3px solid var(--amber); padding: 12px 20px; border-radius: 12px; z-index: 9999; animation: slideIn 0.3s ease; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .spinner-border { color: var(--amber); }
        .text-primary { color: var(--amber) !important; }
        .categoria-select-group { display: flex; gap: 10px; align-items: center; }
        .categoria-select-group select { flex: 1; }
        .search-categoria { margin-bottom: 10px; }
        .search-categoria input { width: 100%; padding: 8px; font-size: 14px; }
        .categoria-list { max-height: 200px; overflow-y: auto; }
        .categoria-item { padding: 8px 12px; cursor: pointer; border-radius: 8px; transition: all 0.2s; }
        .categoria-item:hover { background: rgba(255,255,255,.05); }
        .categoria-item.selected { background: var(--grad); color: #1a1000; font-weight: 600; }
        .alert-danger { background: rgba(248,113,113,.1); border: 1px solid rgba(248,113,113,.35); color: #fca5a5; border-radius: 12px; }
        @media (max-width: 768px) { .sidebar { width: 70px; } .sidebar .menu-item span { display: none; } .sidebar h3 span.brand-txt { display: none; } .main-content { margin-left: 90px; } }
    </style>
</head>
<body>
    <div class="sidebar">
        <h3><span class="bolt"><i class="fas fa-bolt"></i></span> <span class="brand-txt">Placa<em>Certa</em></span></h3>
        <div class="menu-item active" onclick="loadDashboard()"><i class="fas fa-chart-line"></i> <span>Dashboard</span></div>
        <div class="menu-item" onclick="loadProdutos()"><i class="fas fa-box"></i> <span>Produtos</span></div>
        <div class="menu-item" onclick="loadCategorias()"><i class="fas fa-tags"></i> <span>Categorias</span></div>
        <div class="menu-item" onclick="loadPedidos()"><i class="fas fa-shopping-cart"></i> <span>Pedidos</span></div>
        <div class="menu-item" onclick="loadClientes()"><i class="fas fa-users"></i> <span>Clientes</span></div>
        <div class="menu-item" onclick="loadMensagens()"><i class="fas fa-envelope-open-text"></i> <span>Mensagens</span> <span class="badge rounded-pill ms-1" id="msgBadge" style="background:var(--grad);color:#1a1000;display:none">0</span></div>
        <div class="menu-item" onclick="loadConfiguracoes()"><i class="fas fa-cog"></i> <span>Configurações</span></div>
    </div>
    <div class="main-content">
        <div class="top-bar">
            <h2 id="pageTitle" style="margin:0;">Dashboard</h2>
            <div><span id="userName"></span> <button class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Sair</button></div>
        </div>
        <div id="content"></div>
    </div>

    <!-- Modal Produto (com categoria) -->
    <div class="modal fade" id="produtoModal" tabindex="-1">
        <div class="modal-dialog modal-lg"><div class="modal-content"><div class="modal-header border-0"><h5 class="modal-title" id="produtoModalTitle"><i class="fas fa-box"></i> Produto</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">
            <input type="hidden" id="produtoId">
            <div class="row">
                <div class="col-md-6 mb-3"><label class="form-label">Nome *</label><input type="text" id="prodNome" class="form-control"></div>
                <div class="col-md-6 mb-3"><label class="form-label">SKU *</label><input type="text" id="prodSku" class="form-control"></div>
            </div>
            <div class="row">
                <div class="col-md-4 mb-3"><label class="form-label">Preço (R$)</label><input type="number" step="0.01" id="prodPreco" class="form-control"></div>
                <div class="col-md-4 mb-3"><label class="form-label">Quantidade em Estoque</label><input type="number" id="prodQuantidade" class="form-control"></div>
                <div class="col-md-4 mb-3"><label class="form-label">Peso (kg)</label><input type="number" step="0.01" min="0" id="prodPeso" class="form-control" placeholder="0.1"></div>
            </div>
            <div class="mb-3">
                <label class="form-label">Categoria *</label>
                <div class="categoria-select-group">
                    <select id="prodCategoria" class="form-select"></select>
                    <button type="button" class="btn-new-cat" onclick="abrirModalNovaCategoriaRapida()" title="Nova Categoria"><i class="fas fa-plus"></i> Nova</button>
                </div>
                <small class="text-muted">Se a categoria não existir, clique em "Nova" para criar</small>
            </div>
            <div class="row">
                <div class="col-md-4 mb-3"><label class="form-label">Tipo de placa (TV)</label><select id="prodTipoPlaca" class="form-select"><option value="">—</option><option value="PRINCIPAL">Principal</option><option value="FONTE">Fonte</option><option value="TCOM">T-Con</option></select></div>
                <div class="col-md-4 mb-3"><label class="form-label">Marca</label><input type="text" id="prodMarca" class="form-control" maxlength="60" placeholder="LG, Samsung..."></div>
                <div class="col-md-4 mb-3"><label class="form-label">Modelo TV compatível</label><input type="text" id="prodModeloTV" class="form-control" maxlength="120" placeholder="43UJ6525..."></div>
            </div>
            <div class="mb-3"><label class="form-label">Descrição</label><textarea id="prodDescricao" class="form-control" rows="3" maxlength="2000" placeholder="Detalhes do produto exibidos na página principal"></textarea></div>
            <div class="mb-3"><label class="form-label">Foto do produto (URL)</label><input type="url" id="prodImagem" class="form-control" placeholder="https://..." oninput="previewProdImagem()"><div class="mt-2 text-center"><img id="prodImagemPrev" style="max-height:120px;max-width:100%;display:none;border-radius:8px;" alt="Prévia da foto"></div><small class="text-muted">Aparece no lugar do ícone padrão na página principal.</small></div>
            <div class="mb-3"><label class="form-label">Status</label><select id="prodStatus" class="form-select"><option value="ativo">Ativo</option><option value="inativo">Inativo</option></select></div>
            <div class="mb-3 form-check"><input type="checkbox" id="prodDestaque" class="form-check-input"><label class="form-check-label" for="prodDestaque">Destaque na página principal</label></div>
        </div>
        <div class="modal-footer border-0"><button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button><button class="btn btn-primary-custom" onclick="salvarProduto()">Salvar</button></div></div></div>
    </div>

    <!-- Modal Nova Categoria Rápida (dentro do produto) -->
    <div class="modal fade" id="novaCategoriaRapidaModal" tabindex="-1">
        <div class="modal-dialog"><div class="modal-content"><div class="modal-header border-0"><h5 class="modal-title"><i class="fas fa-plus-circle"></i> Nova Categoria</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">
            <div class="mb-3"><label class="form-label">Nome da Categoria *</label><input type="text" id="novaCatNome" class="form-control" placeholder="Ex: Placa Mãe, Fonte, Memória..."></div>
            <div class="mb-3"><label class="form-label">Ícone</label><input type="hidden" id="novaCatIcone" value="fa-microchip"><div class="d-flex align-items-center gap-2 mb-2"><span id="novaCatIconePrev" class="fs-4 px-3 py-1 border rounded"><i class="fas fa-microchip"></i></span><input type="text" id="novaCatIconeBusca" class="form-control" placeholder="Buscar ícone..." oninput="renderIconPicker(NOVA_PICKER)"></div><div id="novaIconPicker" class="border rounded p-2" style="max-height:180px;overflow-y:auto;"></div></div>
            <div class="mb-3"><label class="form-label">Slug (opcional)</label><input type="text" id="novaCatSlug" class="form-control" placeholder="deixe em branco para gerar automaticamente"></div>
        </div>
        <div class="modal-footer border-0"><button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button><button class="btn btn-primary-custom" onclick="criarCategoriaRapida()">Criar e Usar</button></div></div></div>
    </div>

    <!-- Modal Categoria (CRUD normal) -->
    <div class="modal fade" id="categoriaModal" tabindex="-1">
        <div class="modal-dialog"><div class="modal-content"><div class="modal-header border-0"><h5 class="modal-title" id="categoriaModalTitle"><i class="fas fa-tag"></i> Categoria</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div>
        <div class="modal-body"><input type="hidden" id="categoriaId"><div class="mb-3"><label class="form-label">Nome</label><input type="text" id="catNome" class="form-control"></div><div class="mb-3"><label class="form-label">Ícone</label><input type="hidden" id="catIcone" value="fa-microchip"><div class="d-flex align-items-center gap-2 mb-2"><span id="catIconePrev" class="fs-3 px-3 py-1 border rounded"><i class="fas fa-microchip"></i></span><input type="text" id="catIconeBusca" class="form-control" placeholder="Buscar ícone do seu ramo (ex: pizza, camisa, carro...)" oninput="renderIconPicker()"></div><div id="iconPicker" class="border rounded p-2" style="max-height:220px;overflow-y:auto;"></div></div><div class="mb-3"><label class="form-label">Status</label><select id="catStatus" class="form-select"><option value="ativo">Ativo</option><option value="inativo">Inativo</option></select></div></div>
        <div class="modal-footer border-0"><button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button><button class="btn btn-primary-custom" onclick="salvarCategoria()">Salvar</button></div></div></div>
    </div>

    <!-- Modal Detalhes Pedido -->
    <div class="modal fade" id="pedidoModal" tabindex="-1">
        <div class="modal-dialog modal-lg"><div class="modal-content"><div class="modal-header border-0"><h5 class="modal-title"><i class="fas fa-shopping-cart"></i> Detalhes do Pedido</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div>
        <div class="modal-body pedido-detalhes" id="pedidoDetalhesBody"></div><div class="modal-footer border-0"><button class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button></div></div></div>
    </div>

    <!-- Modal Status -->
    <div class="modal fade" id="statusModal" tabindex="-1">
        <div class="modal-dialog"><div class="modal-content"><div class="modal-header border-0"><h5 class="modal-title"><i class="fas fa-truck"></i> Alterar Status do Pedido</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div>
        <div class="modal-body"><div class="mb-3"><label class="form-label">Status</label><select id="statusSelecionado" class="form-select"><option value="pendente">🟡 Pendente</option><option value="pago">💰 Pago</option><option value="enviado">📦 Enviado</option><option value="entregue">✅ Entregue</option><option value="cancelado">❌ Cancelado</option></select></div></div>
        <div class="modal-footer border-0"><button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button><button class="btn btn-primary-custom" onclick="atualizarStatusPedido()">Atualizar Status</button></div></div></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js?v=2"></script>
    <script>
        const API = window.API_BASE;
        const token = localStorage.getItem('token');
        const user = JSON.parse(localStorage.getItem('user') || '{}');
        
        if (!token) window.location.href = '/auth.html';
        // Guard real: valida no servidor (localStorage é burlável)
        window.ensureSession().then((ok) => {
            if (!ok) { window.location.href = '/auth.html'; return null; }
            return fetch(API + '/auth/me', { headers: window.getAuthHeaders() });
        }).then(async (r) => {
            if (!r) return;
            if (!r.ok) { localStorage.removeItem('token'); localStorage.removeItem('user'); window.location.href = '/auth.html'; return; }
            const d = await r.json();
            if (!d.success || d.user?.role !== 'admin') { window.location.href = '/auth.html'; return; }
            localStorage.setItem('user', JSON.stringify({ id: d.user._id, nome: d.user.nome, email: d.user.email, role: d.user.role }));
            document.getElementById('userName').textContent = d.user.nome || 'Admin';
        }).catch(() => window.location.href = '/auth.html');
        document.getElementById('userName').textContent = (user && user.nome) || 'Admin';
        
        let produtoModal, categoriaModal, pedidoModal, statusModal, novaCategoriaRapidaModal;
        let pedidoAtualId = null;
        let listaCategorias = [];
        
        function getHeaders() { return { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' }; }
        
        function showToast(msg, isError) {
            const toast = document.createElement('div');
            toast.className = 'toast-custom';
            toast.style.borderLeftColor = isError ? '#ef4444' : '#10b981';
            toast.innerHTML = '<i class="fas ' + (isError ? 'fa-exclamation-triangle' : 'fa-check-circle') + '"></i> ';
            toast.appendChild(document.createTextNode(String(msg ?? '')));
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
        
        function logout() { window.logoutAll(); window.location.href = '/auth.html'; }

        // Paginacao das tabelas admin (a API retorna page/limit/total/pages)
        const PG_LIMIT = 10;
        const pgProd = { page: 1, pages: 1 }, pgCat = { page: 1, pages: 1 },
              pgPed = { page: 1, pages: 1 }, pgCli = { page: 1, pages: 1 }, pgMsg = { page: 1, pages: 1 };
        let msgFiltro = '';
        function pagerNav(prefix, st) {
            return `<nav class="d-flex justify-content-center align-items-center gap-3 mt-3"><button class="btn btn-outline-light btn-sm" onclick="mudarPaginaTab('${prefix}',-1)" ${st.page <= 1 ? 'disabled' : ''}>← Anterior</button><span class="text-muted small">Página ${st.page} de ${st.pages}</span><button class="btn btn-outline-light btn-sm" onclick="mudarPaginaTab('${prefix}',1)" ${st.page >= st.pages ? 'disabled' : ''}>Próxima →</button></nav>`;
        }
        window.mudarPaginaTab = function(prefix, delta) {
            const map = { prod: [pgProd, loadProdutos], cat: [pgCat, loadCategorias], ped: [pgPed, loadPedidos], cli: [pgCli, loadClientes], msg: [pgMsg, loadMensagens] };
            const entry = map[prefix];
            if (!entry) return;
            const next = entry[0].page + delta;
            if (next < 1 || next > entry[0].pages) return;
            entry[0].page = next;
            entry[1]();
        };
        
        function getStatusClass(status) {
            const classes = { 'pendente': 'badge-warning', 'pago': 'badge-info', 'enviado': 'badge-info', 'entregue': 'badge-success', 'cancelado': 'badge-warning' };
            return classes[status] || 'badge-active';
        }
        
        function getStatusText(status) {
            const texts = { 'pendente': 'Pendente', 'pago': 'Pago', 'enviado': 'Enviado', 'entregue': 'Entregue', 'cancelado': 'Cancelado' };
            return texts[status] || status;
        }
        
        // ==================== CARREGAR CATEGORIAS PARA SELECT ====================
        async function carregarCategoriasParaSelect() {
            try {
                const res = await fetch(API + '/categorias', { headers: getHeaders() });
                const data = await res.json();

        async function salvarProduto() {
            const id = document.getElementById('produtoId').value;
            const categoria = document.getElementById('prodCategoria').value;
            
            if (!document.getElementById('prodNome').value.trim()) { showToast('Preencha o nome do produto!', true); return; }
            if (!document.getElementById('prodSku').value.trim()) { showToast('Preencha o SKU!', true); return; }
            if (!categoria) { showToast('Selecione uma categoria!', true); return; }
            const preco = parseFloat(document.getElementById('prodPreco').value);
            const quantidade = Number(document.getElementById('prodQuantidade').value);
            if (Number.isNaN(preco) || preco < 0) { showToast('Preço inválido (use 0 ou mais)!', true); return; }
            if (!Number.isInteger(quantidade) || quantidade < 0) { showToast('Quantidade inválida (inteiro 0 ou mais)!', true); return; }
            const pesoRaw = document.getElementById('prodPeso').value.trim();
            const peso = pesoRaw === '' ? undefined : Number(pesoRaw);
            if (peso !== undefined && (Number.isNaN(peso) || peso < 0)) { showToast('Peso inválido!', true); return; }
            const descricao = document.getElementById('prodDescricao').value.trim();
            if (descricao.length > 2000) { showToast('Descrição com no máximo 2000 caracteres!', true); return; }
            const imagemUrl = window.safeImg(document.getElementById('prodImagem').value);
            if (document.getElementById('prodImagem').value.trim() && !imagemUrl) { showToast('URL da foto inválida (use http/https)!', true); return; }

            const produto = {
                nome: document.getElementById('prodNome').value.trim(),
                sku: document.getElementById('prodSku').value.trim(),
                descricao,
                imagemUrl,
                preco,
                quantidade,
                ...(peso !== undefined ? { peso } : {}),
                categoria: categoria,
                tipoPlaca: document.getElementById('prodTipoPlaca').value || undefined,
                marca: document.getElementById('prodMarca').value.trim() || undefined,
                modeloTV: document.getElementById('prodModeloTV').value.trim() || undefined,
                destaque: document.getElementById('prodDestaque').checked,
                status: document.getElementById('prodStatus').value
            };
            
            try {
                const url = id ? API + '/produtos/' + id : API + '/produtos';
                const method = id ? 'PUT' : 'POST';
                const res = await fetch(url, { method, headers: getHeaders(), body: JSON.stringify(produto) });
                const data = await res.json();
                if (data.success) {
                    produtoModal.hide();
                    showToast(id ? 'Produto atualizado!' : 'Produto criado!');
                    loadProdutos();
                } else showToast(data.message || 'Erro ao salvar', true);
            } catch(e) { showToast('Erro ao salvar', true); }
        }

        let pickerTarget = null;
        function selectIcon(cls, target) {
            target = target || pickerTarget || {};
            const hidId = target.hidden || 'catIcone';
            const prevId = target.prev || 'catIconePrev';
            const searchId = target.search || 'catIconeBusca';
            const boxId = target.box || 'iconPicker';
            const safe = window.safeIcon(cls);
            document.getElementById(hidId).value = safe;
            document.getElementById(prevId).innerHTML = `<i class="fas ${safe}"></i>`;
            renderIconPicker(target);
        }

        function renderIconPicker(target) {
            target = target || {};
            pickerTarget = target;
            const hidId = target.hidden || 'catIcone';
            const prevId = target.prev || 'catIconePrev';
            const searchId = target.search || 'catIconeBusca';
            const boxId = target.box || 'iconPicker';
            const box = document.getElementById(boxId);
            if (!box) return;
            const current = window.safeIcon(document.getElementById(hidId).value);
            const prev = document.getElementById(prevId);
            if (prev) prev.innerHTML = `<i class="fas ${current}"></i>`;
            const term = ((document.getElementById(searchId) || {}).value || '').toLowerCase().trim();
            let html = '';
            for (const g of (window.ICON_LIB || [])) {
                const icons = g.icons.filter((c) => !term || c.toLowerCase().includes(term) || g.group.toLowerCase().includes(term));
                if (!icons.length) continue;
                html += `<div class="text-muted small mt-2 mb-1">${window.escapeHtml(g.group)}</div><div class="d-flex flex-wrap gap-1">`;
                for (const c of icons) {
                    html += `<button type="button" class="btn btn-sm ${c === current ? 'btn-primary' : 'btn-outline-secondary'}" title="${c}" onclick="selectIcon('${c}')"><i class="fas ${c} fa-lg"></i></button>`;
                }
                html += '</div>';
            }
            box.innerHTML = html || '<p class="text-muted small m-0">Nenhum ícone encontrado.</p>';
        }

                    document.getElementById('pedidoDetalhesBody').innerHTML = `
                        <div class="row"><div class="col-md-6"><h6><i class="fas fa-user"></i> Dados do Cliente</h6><p><strong>Nome:</strong> ${window.escapeHtml(p.cliente?.nome || '-')}<br><strong>Email:</strong> ${window.escapeHtml(p.cliente?.email || '-')}<br><strong>Telefone:</strong> ${window.escapeHtml(p.cliente?.telefone || '-')}<br><strong>CPF:</strong> ${window.escapeHtml(p.cliente?.cpf || '-')}</p></div>
                        <div class="col-md-6"><h6><i class="fas fa-map-marker-alt"></i> Endereço de Entrega</h6><p>${window.escapeHtml(p.endereco?.logradouro || '-')}, ${window.escapeHtml(p.endereco?.numero || '-')}<br>${window.escapeHtml(p.endereco?.bairro || '-')}<br>${window.escapeHtml(p.endereco?.cidade || '-')} - ${window.escapeHtml(p.endereco?.estado || '-')}<br>CEP: ${window.escapeHtml(p.endereco?.cep || '-')}</p></div></div><hr>
                        <h6><i class="fas fa-boxes"></i> Itens do Pedido</h6><div class="table-responsive"><table class="table table-dark table-sm"><thead><tr><th>Produto</th><th>Qtd</th><th>Preço</th><th>Subtotal</th></tr></thead><tbody>${itensHtml}</tbody>
                        <tfoot><tr><td colspan="3" class="text-end"><strong>Subtotal:</strong></td><td>R$ ${(Number(p.subtotal) || 0).toFixed(2)}</td></tr>
                        <tr><td colspan="3" class="text-end"><strong>Frete:</strong></td><td>${(Number(p.frete) || 0) === 0 ? 'Grátis' : 'R$ ' + (Number(p.frete) || 0).toFixed(2)}</td></tr>
                        ${Number(p.desconto) > 0 ? '<tr><td colspan="3" class="text-end"><strong>Desconto:</strong></td><td class="text-success">- R$ ' + (Number(p.desconto) || 0).toFixed(2) + '</td></tr>' : ''}
                        <tr><td colspan="3" class="text-end"><strong>TOTAL:</strong></td><td><strong class="text-primary">R$ ${(Number(p.total) || 0).toFixed(2)}</strong></td></tr></tfoot></table></div><hr>
                        <div class="row"><div class="col-md-6"><strong><i class="fas fa-credit-card"></i> Pagamento:</strong> ${p.pagamento === 'pix' ? 'PIX' : p.pagamento === 'card' ? 'Cartão' : 'Boleto'}</div>
                        <div class="col-md-6"><strong><i class="fas fa-toggle-on"></i> Status:</strong> <span class="${getStatusClass(p.status)}">${getStatusText(p.status)}</span></div></div>
                        <div class="mt-3"><strong><i class="fas fa-calendar"></i> Data:</strong> ${new Date(p.createdAt).toLocaleString()}</div>`;
                    if (!pedidoModal) pedidoModal = new bootstrap.Modal(document.getElementById('pedidoModal'));
                    pedidoModal.show();
                } else { showToast('Erro ao carregar detalhes', true); }
            } catch(e) { showToast('Erro ao carregar detalhes', true); }
        };
        
        window.abrirModalStatus = function(id, statusAtual) {
            pedidoAtualId = id;
            if (!statusModal) statusModal = new bootstrap.Modal(document.getElementById('statusModal'));
            document.getElementById('statusSelecionado').value = statusAtual;
            statusModal.show();
        };
        
        window.atualizarStatusPedido = async function() {
            const novoStatus = document.getElementById('statusSelecionado').value;
            try {
                const res = await fetch(API + '/pedidos/' + pedidoAtualId + '/status', { method: 'PUT', headers: getHeaders(), body: JSON.stringify({ status: novoStatus }) });
                const data = await res.json();
                if (data.success) { statusModal.hide(); showToast('Status atualizado para: ' + getStatusText(novoStatus)); loadPedidos(); }
                else { showToast('Erro ao atualizar status', true); }
            } catch(e) { showToast('Erro ao atualizar status', true); }
        };
        
        // ==================== CLIENTES ====================
        async function loadClientes() {
            document.getElementById('pageTitle').innerHTML = 'Clientes';
            document.getElementById('content').innerHTML = '<div class="text-center p-5"><div class="spinner-border text-primary"></div></div>';
            try {
                const res = await fetch(`${API}/clientes?page=${pgCli.page}&limit=${PG_LIMIT}`, { headers: getHeaders() });
                const data = await res.json();
                if (data.success && data.clientes && data.clientes.length > 0) {
                    pgCli.pages = data.pages || 1;
                    let html = '<div class="data-card"><h4>Clientes (' + (data.total ?? data.clientes.length) + ')</h4><div class="table-responsive"><table class="table table-dark"><thead><tr><th>Nome</th><th>Email</th><th>Telefone</th><th>Cadastro</th><th>Status</th></tr></thead><tbody>';
                    for (const c of data.clientes) { html += `<tr><td>${window.escapeHtml(c.nome || '-')}</td><td>${window.escapeHtml(c.email || '-')}</td><td>${window.escapeHtml(c.telefone || '-')}</td><td>${c.createdAt ? new Date(c.createdAt).toLocaleDateString() : '-'}</td><td><span class="badge-active">${window.escapeHtml(c.status)}</span></td></tr>`; }
                    html += '</tbody></table></div>' + pagerNav('ped', pgPed) + '</div>';
                    document.getElementById('content').innerHTML = html;
                }
            } catch(e) { document.getElementById('content').innerHTML = '<div class="alert alert-danger">Erro ao carregar clientes</div>'; }
        }
        
        // ==================== MENSAGENS (contato do site) ====================
        async function loadMensagens() {
            document.getElementById('pageTitle').innerHTML = 'Mensagens';
            document.getElementById('content').innerHTML = '<div class="text-center p-5"><div class="spinner-border text-primary"></div></div>';
            try {
                const q = `${API}/contato?page=${pgMsg.page}&limit=${PG_LIMIT}${msgFiltro ? `&lida=${msgFiltro}` : ''}`;
                const res = await fetch(q, { headers: getHeaders() });
                const data = await res.json();
                if (!data.success) { showToast(data.message || 'Erro ao carregar', true); return; }
                const list = data.mensagens || [];
                if (list.length === 0 && pgMsg.page > 1) { pgMsg.page--; loadMensagens(); return; }
                pgMsg.pages = data.pages || 1;
                let html = `<div class="data-card"><div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2"><h4>Mensagens (${data.total ?? list.length})</h4>
                    <div class="btn-group btn-group-sm" role="group">
                        <button class="btn ${msgFiltro === '' ? 'btn-primary-custom' : 'btn-outline-light'}" onclick="filtrarMsg('')">Todas</button>
                        <button class="btn ${msgFiltro === 'false' ? 'btn-primary-custom' : 'btn-outline-light'}" onclick="filtrarMsg('false')">Não lidas</button>
                        <button class="btn ${msgFiltro === 'true' ? 'btn-primary-custom' : 'btn-outline-light'}" onclick="filtrarMsg('true')">Lidas</button>
                    </div></div>`;
                if (!list.length) {
                    html += '<p class="text-muted">Nenhuma mensagem.</p>';
                } else {
                    html += '<div class="table-responsive"><table class="table table-dark"><thead><tr><th>Data</th><th>Nome</th><th>E-mail</th><th>Assunto</th><th>Mensagem</th><th>Status</th><th>Ações</th></tr></thead><tbody>';
                    for (const m of list) {
                        html += `<tr>
                            <td class="small">${m.createdAt ? new Date(m.createdAt).toLocaleString('pt-BR') : '-'}</td>
                            <td>${window.escapeHtml(m.nome || '-')}</td>
                            <td class="small">${window.escapeHtml(m.email || '-')}</td>
                            <td>${window.escapeHtml(m.assunto || '—')}</td>
                            <td class="small" style="max-width:280px">${window.escapeHtml(window.truncate(m.mensagem || '', 140))}</td>
                            <td>${m.lida ? '<span class="badge-success">lida</span>' : '<span class="badge-warning">nova</span>'}</td>
                            <td>${m.lida ? '' : `<button class="btn-view" onclick="marcarLida('${m._id}')">Marcar lida</button>`} <button class="btn-view" style="color:#f87171" onclick="excluirMsg('${m._id}')">Excluir</button></td>
                        </tr>`;
                    }
                    html += '</tbody></table></div>' + pagerNav('msg', pgMsg);
                }
                html += '</div>';
                document.getElementById('content').innerHTML = html;
            } catch(e) { document.getElementById('content').innerHTML = '<div class="alert alert-danger">Erro ao carregar mensagens</div>'; }
        }

        function filtrarMsg(v) { msgFiltro = v; pgMsg.page = 1; loadMensagens(); }

        async function marcarLida(id) {
            try {
                const res = await fetch(`${API}/contato/${id}/lida`, { method: 'PUT', headers: getHeaders() });
                const data = await res.json();
                if (res.ok && data.success) { showToast('Mensagem marcada como lida'); loadMensagens(); atualizaMsgBadge(); }
                else showToast(data.message || 'Erro', true);
            } catch { showToast('Erro ao conectar', true); }
        }

        async function excluirMsg(id) {
            if (!confirm('Excluir esta mensagem?')) return;
            try {
                const res = await fetch(`${API}/contato/${id}`, { method: 'DELETE', headers: getHeaders() });
                const data = await res.json();
                if (res.ok && data.success) { showToast('Mensagem excluída'); loadMensagens(); atualizaMsgBadge(); }
                else showToast(data.message || 'Erro', true);
            } catch { showToast('Erro ao conectar', true); }
        }

        async function atualizaMsgBadge() {
            try {
                const res = await fetch(`${API}/contato?lida=false&limit=1`, { headers: getHeaders() });
                const data = await res.json();
                const n = (data.success && data.total) || 0;
                const b = document.getElementById('msgBadge');
                if (b) { b.style.display = n ? '' : 'none'; b.textContent = n; }
            } catch { /* best-effort */ }
        }

        // ==================== CONFIGURACOES ====================
        async function loadConfiguracoes() {
            document.getElementById('pageTitle').innerHTML = 'Configurações';
            document.getElementById('content').innerHTML = '<div class="text-center p-5"><div class="spinner-border text-primary"></div></div>';
            try {
                const res = await fetch(API + '/config/loja', { headers: getHeaders() });
                const data = await res.json();
                if (!data.success) { showToast(data.message || 'Erro ao carregar', true); return; }
                const c = data.config;
                const segs = Object.entries(c.segredos || {}).map(([k]) =>
                    `<span class="badge bg-secondary me-1">${window.escapeHtml(k)}: ***</span>`).join('') || '<span class="text-muted small">nenhum</span>';
                document.getElementById('content').innerHTML = `
                <div class="data-card">
                    <h4><i class="fab fa-whatsapp"></i> WhatsApp da loja</h4>
                    <div class="row">
                        <div class="col-md-6 mb-3"><label class="form-label">Número (só dígitos, com DDI)</label><input id="cfgZap" class="form-control" value="${window.escapeHtml(c.whatsappNumero || '')}" placeholder="5511999999999"></div>
                        <div class="col-md-6 mb-3"><label class="form-label">Instância Evolution</label><input id="cfgInst" class="form-control" value="${window.escapeHtml(c.evoInstance || '')}" placeholder="loja01"></div>
                    </div>
                    <p>Status pareamento: <strong id="zapStatus">—</strong> <button class="btn btn-sm btn-outline-light ms-2" onclick="statusZap()">Verificar</button></p>
                    <small class="text-muted">Pareie pelo QR no log do serviço Evolution; o número recebe os avisos de pedido.</small>
                </div>
                <div class="data-card mt-3">
                    <h4><i class="fas fa-credit-card"></i> Pagamento</h4>
                    <div class="mb-3"><label class="form-label">Condições (exibidas no checkout)</label><textarea id="cfgCond" class="form-control" rows="3" maxlength="2000">${window.escapeHtml(c.condicoesPagamento || '')}</textarea></div>
                    <div class="row">
                        <div class="col-md-4 mb-3"><label class="form-label">Public Key MP</label><input id="cfgPk" class="form-control" value="${window.escapeHtml(c.mpPublicKey || '')}"></div>
                        <div class="col-md-4 mb-3"><label class="form-label">Parcelas máx</label><input id="cfgParc" type="number" min="1" max="21" class="form-control" value="${c.parcelasMax ?? 12}"></div>
                        <div class="col-md-4 mb-3"><label class="form-label">Desconto PIX %</label><input id="cfgDesc" type="number" min="0" max="100" step="0.1" class="form-control" value="${c.descontoPix ?? 5}"></div>
                    </div>
                </div>
                <div class="data-card mt-3">
                    <h4><i class="fas fa-truck"></i> Faixas de frete <small class="text-muted">(vazio = regra padrão)</small></h4>
                    <div id="faixasList"></div>
                    <button class="btn btn-sm btn-outline-light" onclick="addFaixaRow()">+ Adicionar faixa</button>
                </div>
                <div class="data-card mt-3">
                    <h4><i class="fas fa-address-card"></i> Loja <small class="text-muted">(exibidos no contato/rodapé)</small></h4>
                    <div class="row">
                        <div class="col-md-6 mb-3"><label class="form-label"><i class="fas fa-envelope"></i> E-mail da loja</label><input id="cfgEmailLoja" type="email" class="form-control" maxlength="160" value="${window.escapeHtml(c.emailLoja || '')}" placeholder="contato@sualoja.com.br"></div>
                        <div class="col-md-6 mb-3"><label class="form-label"><i class="fas fa-clock"></i> Horário de atendimento</label><input id="cfgHorario" class="form-control" maxlength="120" value="${window.escapeHtml(c.horarioAtendimento || '')}" placeholder="Seg–Sex, 8h às 18h"></div>
                    </div>
                </div>
                <div class="data-card mt-3">
                    <h4><i class="fas fa-share-nodes"></i> Redes sociais <small class="text-muted">(vazio = ícone oculto no rodapé)</small></h4>
                    <div class="row">
                        <div class="col-md-6 mb-3"><label class="form-label"><i class="fab fa-instagram"></i> Instagram</label><input id="cfgRedeInstagram" class="form-control" maxlength="300" value="${window.escapeHtml(c.redesSociais?.instagram || '')}" placeholder="https://instagram.com/sualoja"></div>
                        <div class="col-md-6 mb-3"><label class="form-label"><i class="fab fa-facebook"></i> Facebook</label><input id="cfgRedeFacebook" class="form-control" maxlength="300" value="${window.escapeHtml(c.redesSociais?.facebook || '')}" placeholder="https://facebook.com/sualoja"></div>
                        <div class="col-md-6 mb-3"><label class="form-label"><i class="fab fa-youtube"></i> YouTube</label><input id="cfgRedeYoutube" class="form-control" maxlength="300" value="${window.escapeHtml(c.redesSociais?.youtube || '')}" placeholder="https://youtube.com/@sualoja"></div>
                        <div class="col-md-6 mb-3"><label class="form-label"><i class="fab fa-tiktok"></i> TikTok</label><input id="cfgRedeTiktok" class="form-control" maxlength="300" value="${window.escapeHtml(c.redesSociais?.tiktok || '')}" placeholder="https://tiktok.com/@sualoja"></div>
                    </div>
                </div>
                <div class="data-card mt-3">
                    <h4><i class="fas fa-key"></i> Segredos cifrados</h4>
                    <p>${segs}</p>
                    <div class="row">
                        <div class="col-md-6 mb-3"><label class="form-label">Nome (novo)</label><input id="cfgSegNome" class="form-control" placeholder="ex: EVO_TOKEN_EXTRA"></div>
                        <div class="col-md-6 mb-3"><label class="form-label">Valor (novo)</label><input id="cfgSegValor" type="password" class="form-control" autocomplete="new-password"></div>
                    </div>
                    <small class="text-muted">Valores nunca voltam do servidor (aparecem como ***). Chave AES em SETTINGS_KEY no .env.</small>
                </div>
                <button class="btn-primary-custom mt-3" onclick="salvarConfiguracoes()"><i class="fas fa-save"></i> Salvar configurações</button>`;
                (c.faixasFrete || []).forEach(addFaixaRow);
            } catch(e) { document.getElementById('content').innerHTML = '<div class="alert alert-danger">Erro ao carregar configurações</div>'; }
        }

        async function statusZap() {
            try {
                const res = await fetch(API + '/config/whatsapp/status', { headers: getHeaders() });
                const data = await res.json();
                document.getElementById('zapStatus').textContent = !data.status?.configurado ? 'não configurado' : ('Evolution: ' + (data.status.estado || '?'));
            } catch { document.getElementById('zapStatus').textContent = 'erro'; }
        }

        function faixaRow(f) {
            f = f || {};
            return `<div class="row g-2 mb-2 fx-row">
                <div class="col-2"><input class="form-control fx-uf" maxlength="2" placeholder="UF" value="${window.escapeHtml(f.uf || '')}"></div>
                <div class="col-3"><input class="form-control fx-peso" type="number" min="0" step="0.1" placeholder="Até kg" value="${f.atePeso ?? ''}"></div>
                <div class="col-2"><input class="form-control fx-valor" type="number" min="0" step="0.01" placeholder="R$" value="${f.valor ?? ''}"></div>
                <div class="col-2"><input class="form-control fx-gratis" type="number" min="0" step="0.01" placeholder="Grátis+" value="${f.gratisAcima ?? ''}"></div>
                <div class="col-2"><input class="form-control fx-prazo" type="number" min="1" max="60" placeholder="Dias" value="${f.prazoDias ?? ''}"></div>
                <div class="col-1"><button class="btn btn-sm btn-outline-danger" onclick="this.closest('.fx-row').remove()">✕</button></div>
            </div>`;
        }
        function addFaixaRow(f) {
            document.getElementById('faixasList').insertAdjacentHTML('beforeend', faixaRow(f));
        }
        function collectFaixas() {
            return [...document.querySelectorAll('#faixasList .fx-row')].map((r) => ({
                uf: r.querySelector('.fx-uf').value.trim().toUpperCase(),
                atePeso: Number(r.querySelector('.fx-peso').value),
                valor: Number(r.querySelector('.fx-valor').value),
                gratisAcima: Number(r.querySelector('.fx-gratis').value || 0),
                prazoDias: Number(r.querySelector('.fx-prazo').value || 5)
            }));
        }

        async function salvarConfiguracoes() {
            const body = {
                whatsappNumero: document.getElementById('cfgZap').value,
                evoInstance: document.getElementById('cfgInst').value,
                condicoesPagamento: document.getElementById('cfgCond').value,
                mpPublicKey: document.getElementById('cfgPk').value,
                parcelasMax: Number(document.getElementById('cfgParc').value),
                descontoPix: Number(document.getElementById('cfgDesc').value),
                faixasFrete: collectFaixas(),
                emailLoja: document.getElementById('cfgEmailLoja').value.trim(),
                horarioAtendimento: document.getElementById('cfgHorario').value.trim(),
                redesSociais: {
                    instagram: document.getElementById('cfgRedeInstagram').value.trim(),
                    facebook: document.getElementById('cfgRedeFacebook').value.trim(),
                    youtube: document.getElementById('cfgRedeYoutube').value.trim(),
                    tiktok: document.getElementById('cfgRedeTiktok').value.trim()
                }
            };
            const sn = document.getElementById('cfgSegNome').value.trim();
            const sv = document.getElementById('cfgSegValor').value;
            if (sn && sv) body.segredos = { [sn]: sv };
            else if (sn || sv) { showToast('Preencha nome e valor do segredo', true); return; }
            try {
                const res = await fetch(API + '/config/loja', { method: 'PUT', headers: getHeaders(), body: JSON.stringify(body) });
                const data = await res.json();
                if (res.ok && data.success) { showToast('Configurações salvas!'); loadConfiguracoes(); }
                else showToast(data.message || 'Erro ao salvar', true);
            } catch { showToast('Erro ao conectar', true); }
        }

        loadDashboard();
        atualizaMsgBadge();
    </script>
</body>
</html>
