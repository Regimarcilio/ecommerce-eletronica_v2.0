<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | TechStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #0a0a0f; color: #fff; font-family: 'Segoe UI', sans-serif; }
        .navbar { background: rgba(10,10,15,0.95); backdrop-filter: blur(10px); border-bottom: 1px solid #4361ee33; }
        .logo { font-size: 1.8rem; font-weight: 800; background: linear-gradient(135deg, #4361ee, #4cc9f0); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-decoration: none; }
        .form-card, .summary-card { background: #1a1a2e; border: 1px solid #4361ee33; border-radius: 16px; padding: 25px; margin-bottom: 20px; }
        .btn-primary-custom { background: linear-gradient(135deg, #4361ee, #3a0ca3); border: none; color: #fff; padding: 12px 30px; border-radius: 30px; transition: all 0.3s; }
        .btn-primary-custom:hover { transform: translateY(-2px); box-shadow: 0 5px 20px #4361ee66; }
        .form-control, .form-select { background: #0a0a0f; border: 1px solid #4361ee; color: #fff; padding: 12px; }
        .form-control:focus, .form-select:focus { background: #0a0a0f; border-color: #4cc9f0; box-shadow: none; }
        .payment-option { padding: 15px; border: 1px solid #4361ee33; border-radius: 12px; margin-bottom: 10px; cursor: pointer; transition: all 0.3s; }
        .payment-option:hover, .payment-option.selected { background: #4361ee20; border-color: #4361ee; }
        .toast-custom { position: fixed; bottom: 20px; right: 20px; background: #0d1117; border-left: 3px solid #10b981; padding: 12px 20px; border-radius: 8px; z-index: 9999; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg fixed-top">
        <div class="container">
            <a class="logo" href="/"><i class="fas fa-microchip"></i> TechStore</a>
            <a href="/cart.html" class="btn btn-outline-light"><i class="fas fa-arrow-left"></i> Voltar</a>
        </div>
    </nav>

    <div class="container py-5" style="margin-top: 60px;">
        <h2 class="mb-4"><i class="fas fa-credit-card text-primary"></i> Finalizar Pedido</h2>
        
        <div class="row">
            <div class="col-lg-7">
                <div class="form-card">
                    <h4 class="mb-3">Dados do Cliente</h4>
                    <form id="checkoutForm">
                        <div class="row">
                            <div class="col-md-6 mb-3"><label>Nome completo</label><input type="text" id="nome" class="form-control" required></div>
                            <div class="col-md-6 mb-3"><label>Email</label><input type="email" id="email" class="form-control" required></div>
                            <div class="col-md-6 mb-3"><label>Telefone</label><input type="tel" id="telefone" class="form-control" required></div>
                            <div class="col-md-6 mb-3"><label>CPF</label><input type="text" id="cpf" class="form-control"></div>
                        </div>
                        
                        <h5 class="mt-3 mb-3">Endereço de Entrega</h5>
                        <div class="mb-3" id="savedAddrWrap" style="display:none;"><label>Usar endereço salvo</label><select id="savedAddr" class="form-select" onchange="preencherEnderecoSalvo()"><option value="">Preencher manualmente</option></select></div>
                        <div class="row">
                            <div class="col-md-8 mb-3"><label>Logradouro</label><input type="text" id="endereco" class="form-control" required></div>
                            <div class="col-md-4 mb-3"><label>Número</label><input type="text" id="numero" class="form-control" required></div>
                            <div class="col-md-6 mb-3"><label>Complemento</label><input type="text" id="complemento" class="form-control"></div>
                            <div class="col-md-6 mb-3"><label>Bairro</label><input type="text" id="bairro" class="form-control" required></div>
                            <div class="col-md-6 mb-3"><label>Cidade</label><input type="text" id="cidade" class="form-control" required></div>
                            <div class="col-md-4 mb-3"><label>Estado</label><select id="estado" class="form-select" required><option value="">Selecione</option><option value="SP">SP</option><option value="RJ">RJ</option><option value="MG">MG</option></select></div>
                            <div class="col-md-2 mb-3"><label>CEP</label><input type="text" id="cep" class="form-control" required></div>
                        </div>
                        
                        <h5 class="mt-3 mb-3">Forma de Pagamento</h5>
                        <div class="payment-option" onclick="selectPayment('pix')" id="paymentPix">
                            <i class="fab fa-pix fa-2x me-2"></i> <strong>PIX</strong> (5% de desconto)
                        </div>
                        <div class="payment-option" onclick="selectPayment('card')" id="paymentCard">
                            <i class="fas fa-credit-card fa-2x me-2"></i> <strong>Cartão de Crédito</strong> (<span id="cardParcLabel">Até 12x</span>)
                        </div>
                        <p class="text-muted small mt-2" id="condText" style="display:none;"></p>
                        <div class="payment-option" onclick="selectPayment('boleto')" id="paymentBoleto">
                            <i class="fas fa-barcode fa-2x me-2"></i> <strong>Boleto Bancário</strong>
                        </div>
                        <input type="hidden" id="paymentMethod" value="pix">
                    </form>
                </div>
            </div>
            
            <div class="col-lg-5">
                <div class="summary-card">
                    <h4 class="mb-3">Resumo do Pedido</h4>
                    <div id="orderItems"></div>
                    <hr>
                    <div class="d-flex justify-content-between mb-2"><span>Subtotal:</span><span id="orderSubtotal">R$ 0,00</span></div>
                    <div class="d-flex justify-content-between mb-2"><span>Frete:</span><span id="orderFrete">Grátis acima de R$ 100</span></div>
                    <div class="d-flex justify-content-between mb-2" id="discountRow" style="display:none;"><span>Desconto PIX (5%):</span><span id="discountAmount" class="text-success">R$ 0,00</span></div>
                    <hr>
                    <div class="d-flex justify-content-between mb-3"><strong>TOTAL:</strong><strong id="orderTotal" style="color:#4361ee;font-size:1.5rem;">R$ 0,00</strong></div>
                    <button class="btn btn-primary-custom w-100" onclick="confirmarPedido()"><i class="fas fa-check-circle"></i> Confirmar Pedido</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js?v=2"></script>
    <script>
        const API = window.API_BASE;
        const token = localStorage.getItem('token');
        const user = JSON.parse(localStorage.getItem('user') || '{}');
        
        if (!token) window.location.href = '/auth.html';
        
        let cart = JSON.parse(localStorage.getItem('checkoutCart') || localStorage.getItem('cart') || '[]');
        let selectedPayment = 'pix';
        let cfgPix = 5, cfgParc = 12;

        async function loadCondicoes() {
            try {
                const res = await fetch(API + '/api/config/loja/public');
                const data = await res.json();
                if (res.ok && data.success) {
                    cfgPix = Number(data.config.descontoPix ?? 5);
                    cfgParc = Number(data.config.parcelasMax ?? 12);
                    document.getElementById('cardParcLabel').textContent = `Até ${cfgParc}x`;
                    if (data.config.condicoesPagamento) {
                        const el = document.getElementById('condText');
                        el.textContent = data.config.condicoesPagamento;
                        el.style.display = '';
                    }
                    calcularTotal();
                }
            } catch { /* mantem padrao */ }
        }
        let subtotal = 0;
        let savedAddrs = [];

        async function loadEnderecosSalvos() {
            try {
                const res = await fetch(API + '/auth/enderecos', { headers: window.getAuthHeaders() });
                const data = await res.json();
                if (res.ok && data.success && (data.enderecos || []).length > 0) {
                    savedAddrs = data.enderecos;
                    const sel = document.getElementById('savedAddr');
                    savedAddrs.forEach((e, i) => {
                        const opt = document.createElement('option');
                        opt.value = String(i);
                        opt.textContent = `${e.logradouro || '-'}, ${e.numero || '-'} - ${e.bairro || '-'}/${e.estado || '-'}`;
                        sel.appendChild(opt);
                    });
                    document.getElementById('savedAddrWrap').style.display = '';
                }
            } catch { /* sem enderecos: manual */ }
        }

        function preencherEnderecoSalvo() {
            const idx = document.getElementById('savedAddr').value;
            if (idx === '') return;
            const e = savedAddrs[Number(idx)] || {};
            document.getElementById('endereco').value = e.logradouro || '';
            document.getElementById('numero').value = e.numero || '';
            document.getElementById('complemento').value = e.complemento || '';
            document.getElementById('bairro').value = e.bairro || '';
            document.getElementById('cidade').value = e.cidade || '';
            window.setSelectValue(document.getElementById('estado'), e.estado || '');
            document.getElementById('cep').value = e.cep || '';
        }
        
        if (cart.length === 0) window.location.href = '/cart.html';
        
        function selectPayment(method) {
            selectedPayment = method;
            document.getElementById('paymentMethod').value = method;
            ['pix', 'card', 'boleto'].forEach(m => {
                document.getElementById(`payment${m.charAt(0).toUpperCase() + m.slice(1)}`).classList.remove('selected');
            });
            document.getElementById(`payment${method.charAt(0).toUpperCase() + method.slice(1)}`).classList.add('selected');
            calcularTotal();
        }
        
        function calcularTotal() {
            subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const frete = subtotal > 100 ? 0 : 20;
            let desconto = 0;
            if (selectedPayment === 'pix') { desconto = subtotal * (cfgPix / 100); document.getElementById('discountRow').style.display = 'flex'; document.getElementById('discountRow').firstElementChild.textContent = `Desconto PIX (${cfgPix}%):`; }
            else { document.getElementById('discountRow').style.display = 'none'; }
            const total = subtotal + frete - desconto;
            document.getElementById('orderSubtotal').innerText = `R$ ${subtotal.toFixed(2)}`;
            document.getElementById('orderFrete').innerHTML = frete === 0 ? '<span class="text-success">Grátis</span>' : `R$ ${frete.toFixed(2)}`;
            document.getElementById('discountAmount').innerText = `R$ ${desconto.toFixed(2)}`;
            document.getElementById('orderTotal').innerText = `R$ ${total.toFixed(2)}`;
        }
        
        function renderOrderItems() {
            const container = document.getElementById('orderItems');
            container.innerHTML = '';
            cart.forEach(item => {
                const name = window.escapeHtml(item.name);
                const qty = Number(item.quantity) || 0;
                const line = (Number(item.price) || 0) * qty;
                container.innerHTML += `<div class="d-flex justify-content-between mb-2"><span>${name} x${qty}</span><span>R$ ${line.toFixed(2)}</span></div>`;
            });
            calcularTotal();
        }
        
        function showToast(msg, isError = false) {
            const toast = document.createElement('div');
            toast.className = 'toast-custom';
            toast.style.borderLeftColor = isError ? '#ef4444' : '#10b981';
            const icon = isError ? 'fa-exclamation-triangle' : 'fa-check-circle';
            toast.innerHTML = `<i class="fas ${icon}"></i> `;
            toast.appendChild(document.createTextNode(String(msg ?? '')));
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
        
        async function confirmarPedido() {
            const nome = document.getElementById('nome').value.trim();
            const email = document.getElementById('email').value.trim();
            const telefone = document.getElementById('telefone').value.trim();
            const endereco = document.getElementById('endereco').value.trim();
            const numero = document.getElementById('numero').value.trim();
            const bairro = document.getElementById('bairro').value.trim();
            const cidade = document.getElementById('cidade').value.trim();
            const estado = document.getElementById('estado').value;
            const cep = document.getElementById('cep').value.trim();
            
            if (!nome || !email || !telefone || !endereco || !numero || !bairro || !cidade || !estado || !cep) {
                showToast('Preencha todos os campos obrigatórios!', true);
                return;
            }
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showToast('E-mail inválido', true); return; }
            if (!['pix', 'card', 'boleto'].includes(selectedPayment)) { showToast('Pagamento inválido', true); return; }
            
            // Backend recalcula subtotal/frete/desconto/total — envia apenas o essencial
            const pedido = {
                cliente: { nome, email, telefone, cpf: document.getElementById('cpf').value.trim() },
                endereco: {
                    logradouro: endereco, numero, complemento: document.getElementById('complemento').value.trim(),
                    bairro, cidade, estado, cep
                },
                pagamento: selectedPayment,
                items: cart.map(i => ({ produtoId: i.id, quantity: Number(i.quantity) || 1 }))
            };
            
            try {
                const send = () => fetch(API + '/pedidos', {
                    method: 'POST',
                    headers: window.getAuthHeaders(),
                    body: JSON.stringify(pedido)
                });
                let res = await send();
                if (res.status === 401 && await window.refreshSession()) res = await send();
                const data = await res.json();
                if (res.status === 401) { window.logoutAll(); window.location.href = '/auth.html'; return; }
                if (res.ok && data.success) {
                    localStorage.removeItem('cart');
                    localStorage.removeItem('checkoutCart');
                    showToast(`Pedido ${data.pedido.numero} confirmado! Total: R$ ${Number(data.pedido.total).toFixed(2)}`);
                    setTimeout(() => window.location.href = '/pedidos.html', 2000);
                } else showToast(data.message || 'Erro ao processar pedido', true);
            } catch(e) { showToast('Erro ao conectar', true); }
        }
        
        if (user.nome) {
            document.getElementById('nome').value = user.nome;
            document.getElementById('email').value = user.email;
            document.getElementById('telefone').value = user.telefone || '';
        }
        
        selectPayment('pix');
        renderOrderItems();
        loadEnderecosSalvos();
        loadCondicoes();
        window.ensureSession().then((ok) => { if (!ok) window.location.href = '/auth.html'; });
    </script>
</body>
</html>
