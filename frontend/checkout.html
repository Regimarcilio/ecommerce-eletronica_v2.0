<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | TechStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: #0a0a0f; color: #fff; }
        .navbar { background: rgba(10,10,15,0.95); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(67,97,238,0.3); padding: 15px 0; }
        .navbar-brand { font-size: 1.8rem; font-weight: 800; background: linear-gradient(135deg, #4361ee, #4cc9f0); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .btn-primary-custom { background: linear-gradient(135deg, #4361ee, #3a0ca3); border: none; padding: 12px 28px; border-radius: 50px; color: #fff; font-weight: 600; transition: all 0.3s; }
        .btn-primary-custom:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(67,97,238,0.4); }
        .form-card, .order-summary { background: rgba(26,26,46,0.8); border-radius: 15px; padding: 25px; border: 1px solid rgba(67,97,238,0.3); margin-bottom: 20px; }
        .form-control, .form-select { background: #0a0a0f; border: 1px solid #4361ee; color: #fff; padding: 12px; }
        .form-control:focus { background: #0a0a0f; color: #fff; border-color: #4cc9f0; box-shadow: none; }
        .form-label { font-weight: 500; margin-bottom: 8px; }
        .payment-option { padding: 15px; border: 1px solid rgba(67,97,238,0.3); border-radius: 10px; margin-bottom: 10px; cursor: pointer; transition: all 0.3s; }
        .payment-option:hover, .payment-option.selected { background: rgba(67,97,238,0.2); border-color: #4361ee; }
        .checkout-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.1); }
        @media (max-width: 768px) { .form-card, .order-summary { margin-bottom: 15px; } }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="/"><i class="bi bi-cpu"></i> TECHSTORE</a>
            <a href="/cart.html" class="btn btn-outline-light"><i class="bi bi-arrow-left"></i> Voltar ao Carrinho</a>
        </div>
    </nav>

    <div class="container py-5">
        <h2 class="mb-4"><i class="bi bi-credit-card"></i> Finalizar Pedido</h2>
        
        <div class="row">
            <div class="col-lg-7">
                <div class="form-card">
                    <h4 class="mb-3">Dados do Cliente</h4>
                    <form id="checkoutForm">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Nome completo *</label>
                                <input type="text" id="nome" class="form-control" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Email *</label>
                                <input type="email" id="email" class="form-control" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Telefone *</label>
                                <input type="tel" id="telefone" class="form-control" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">CPF/CNPJ</label>
                                <input type="text" id="cpf" class="form-control">
                            </div>
                        </div>
                        
                        <h5 class="mt-3 mb-3">Endereço de Entrega</h5>
                        <div class="row">
                            <div class="col-md-8 mb-3">
                                <label class="form-label">Logradouro *</label>
                                <input type="text" id="endereco" class="form-control" required>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Número *</label>
                                <input type="text" id="numero" class="form-control" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Complemento</label>
                                <input type="text" id="complemento" class="form-control">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Bairro *</label>
                                <input type="text" id="bairro" class="form-control" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Cidade *</label>
                                <input type="text" id="cidade" class="form-control" required>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Estado *</label>
                                <select id="estado" class="form-select" required>
                                    <option value="">Selecione</option>
                                    <option value="SP">São Paulo</option>
                                    <option value="RJ">Rio de Janeiro</option>
                                    <option value="MG">Minas Gerais</option>
                                    <option value="RS">Rio Grande do Sul</option>
                                    <option value="BA">Bahia</option>
                                </select>
                            </div>
                            <div class="col-md-2 mb-3">
                                <label class="form-label">CEP *</label>
                                <input type="text" id="cep" class="form-control" required>
                            </div>
                        </div>
                        
                        <h5 class="mt-3 mb-3">Forma de Pagamento</h5>
                        <div class="payment-option" onclick="selectPayment('pix')" id="paymentPix">
                            <i class="bi bi-qr-code fs-4 me-2"></i> PIX (Ganhe 5% de desconto)
                        </div>
                        <div class="payment-option" onclick="selectPayment('card')" id="paymentCard">
                            <i class="bi bi-credit-card fs-4 me-2"></i> Cartão de Crédito (Até 12x)
                        </div>
                        <div class="payment-option" onclick="selectPayment('boleto')" id="paymentBoleto">
                            <i class="bi bi-bank fs-4 me-2"></i> Boleto Bancário (Até 3 dias úteis)
                        </div>
                        <input type="hidden" id="paymentMethod" value="pix">
                    </form>
                </div>
            </div>
            
            <div class="col-lg-5">
                <div class="order-summary">
                    <h4 class="mb-3">Resumo do Pedido</h4>
                    <div id="orderItems"></div>
                    <hr>
                    <div class="d-flex justify-content-between mb-2">
                        <span>Subtotal:</span>
                        <span id="orderSubtotal">R$ 0,00</span>
                    </div>
                    <div class="d-flex justify-content-between mb-2">
                        <span>Frete:</span>
                        <span id="orderFrete">Grátis</span>
                    </div>
                    <div class="d-flex justify-content-between mb-2" id="discountRow" style="display: none;">
                        <span>Desconto (5%):</span>
                        <span id="discountAmount">R$ 0,00</span>
                    </div>
                    <hr>
                    <div class="d-flex justify-content-between mb-3">
                        <strong>TOTAL:</strong>
                        <strong id="orderTotal" style="color: #4361ee; font-size: 1.3rem;">R$ 0,00</strong>
                    </div>
                    <button class="btn btn-primary-custom w-100" onclick="confirmarPedido()">
                        <i class="bi bi-check-circle"></i> Confirmar Pedido
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let cart = JSON.parse(localStorage.getItem('checkoutCart') || '[]');
        let selectedPayment = 'pix';
        let subtotal = 0;
        
        function selectPayment(method) {
            selectedPayment = method;
            document.getElementById('paymentMethod').value = method;
            
            // Remover classe selected de todos
            ['pix', 'card', 'boleto'].forEach(m => {
                document.getElementById(`payment${m.charAt(0).toUpperCase() + m.slice(1)}`).classList.remove('selected');
            });
            document.getElementById(`payment${method.charAt(0).toUpperCase() + method.slice(1)}`).classList.add('selected');
            
            calcularTotal();
        }
        
        function calcularTotal() {
            subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const frete = subtotal > 100 ? 0 : 20;
            let desconto = 0;
            
            if (selectedPayment === 'pix') {
                desconto = subtotal * 0.05;
                document.getElementById('discountRow').style.display = 'flex';
            } else {
                document.getElementById('discountRow').style.display = 'none';
            }
            
            const total = subtotal + frete - desconto;
            
            document.getElementById('orderSubtotal').innerText = `R$ ${subtotal.toFixed(2)}`;
            document.getElementById('orderFrete').innerText = frete === 0 ? 'Grátis' : `R$ ${frete.toFixed(2)}`;
            document.getElementById('discountAmount').innerText = `R$ ${desconto.toFixed(2)}`;
            document.getElementById('orderTotal').innerText = `R$ ${total.toFixed(2)}`;
        }
        
        function renderOrderItems() {
            const container = document.getElementById('orderItems');
            container.innerHTML = '';
            cart.forEach(item => {
                container.innerHTML += `
                    <div class="checkout-item">
                        <span>${item.name} x${item.quantity}</span>
                        <span>R$ ${(item.price * item.quantity).toFixed(2)}</span>
                    </div>
                `;
            });
            calcularTotal();
        }
        
        function confirmarPedido() {
            // Validar campos obrigatórios
            const nome = document.getElementById('nome').value;
            const email = document.getElementById('email').value;
            const telefone = document.getElementById('telefone').value;
            const endereco = document.getElementById('endereco').value;
            const numero = document.getElementById('numero').value;
            
            if (!nome || !email || !telefone || !endereco || !numero) {
                alert('Por favor, preencha todos os campos obrigatórios!');
                return;
            }
            
            // Criar objeto do pedido
            const pedido = {
                numero: 'PED-' + Date.now(),
                data: new Date().toLocaleString(),
                cliente: { nome, email, telefone },
                endereco: {
                    logradouro: endereco,
                    numero: numero,
                    complemento: document.getElementById('complemento').value,
                    bairro: document.getElementById('bairro').value,
                    cidade: document.getElementById('cidade').value,
                    estado: document.getElementById('estado').value,
                    cep: document.getElementById('cep').value
                },
                pagamento: selectedPayment,
                items: cart,
                subtotal: subtotal,
                frete: subtotal > 100 ? 0 : 20,
                desconto: selectedPayment === 'pix' ? subtotal * 0.05 : 0,
                total: subtotal + (subtotal > 100 ? 0 : 20) - (selectedPayment === 'pix' ? subtotal * 0.05 : 0)
            };
            
            // Salvar pedido no histórico
            let pedidos = JSON.parse(localStorage.getItem('pedidos') || '[]');
            pedidos.unshift(pedido);
            localStorage.setItem('pedidos', JSON.stringify(pedidos));
            
            // Limpar carrinho
            localStorage.removeItem('cart');
            localStorage.removeItem('checkoutCart');
            
            // Mostrar mensagem de sucesso
            alert(`Pedido ${pedido.numero} confirmado com sucesso!\nTotal: R$ ${pedido.total.toFixed(2)}\n\nVocê receberá um email com os detalhes.`);
            
            // Redirecionar para página de confirmação
            window.location.href = '/';
        }
        
        // Preencher dados do usuário logado se disponível
        const user = JSON.parse(localStorage.getItem('user') || '{}');
        if (user.nome) {
            document.getElementById('nome').value = user.nome;
            document.getElementById('email').value = user.email;
            document.getElementById('telefone').value = user.telefone || '';
        }
        
        selectPayment('pix');
        renderOrderItems();
    </script>
</body>
</html>
