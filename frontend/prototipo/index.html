<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PlacaCerta — Protótipo</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root{--bg:#0a0e1a;--card:#131b36;--line:rgba(255,255,255,.09);--amber:#ffb224;--amber2:#ff8a00;--txt:#f2f5ff;--mut:#9aa4c7;--grad:linear-gradient(120deg,#ffb224,#ff8a00 55%,#ff5e3a);--r:18px}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--txt);font-family:Arial,Helvetica,sans-serif;min-height:100vh}
a{color:inherit;text-decoration:none}
.wrap{max-width:1200px;margin:0 auto;padding:0 24px}
.demo{background:var(--grad);color:#1a1000;font-size:.8rem;font-weight:700;text-align:center;padding:8px 16px}
header{position:sticky;top:0;z-index:50;background:rgba(10,14,26,.92);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;gap:20px;min-height:64px;flex-wrap:wrap;padding:8px 24px}
.brand{font-weight:700;font-size:1.25rem}
.brand em{font-style:normal;color:var(--amber)}
.nav-links{display:flex;gap:16px;flex-wrap:wrap;font-size:.88rem;color:var(--mut)}
.nav-links a:hover,.nav-links a.on{color:var(--amber)}
main{padding:36px 0 72px}
.hero{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:44px 32px;margin-bottom:28px;text-align:center}
.hero h1{font-size:2rem;margin-bottom:10px}
.hero h1 em{font-style:normal;color:var(--amber)}
.hero p{color:var(--mut);margin-bottom:20px}
.btn{display:inline-flex;align-items:center;gap:8px;border:none;cursor:pointer;font-weight:700;font-size:.88rem;padding:11px 22px;border-radius:999px;background:var(--grad);color:#1a1000}
.btn-ghost{background:transparent;color:var(--txt);border:1px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.card:hover{border-color:rgba(255,178,36,.4)}
.card h3{font-size:1rem;margin-bottom:6px}
.card .meta{font-size:.82rem;color:var(--mut);margin-bottom:8px}
.card .price{font-size:1.2rem;font-weight:700;color:var(--amber);margin-bottom:12px}
.badge{display:inline-block;padding:4px 12px;border-radius:999px;font-size:.7rem;font-weight:700;background:rgba(110,231,183,.12);color:#6ee7b7}
footer{border-top:1px solid var(--line);padding:24px 0;color:var(--mut);font-size:.82rem;text-align:center}
</style>
</head>
<body>
<div class="demo"><i class="fa-solid fa-flask"></i>&nbsp; PROTÓTIPO — dados fictícios, sem login, sem backend</div>
<header><div class="wrap nav">
<a class="brand" href="./index.html">⚡ Placa<em>Certa</em></a>
<nav class="nav-links">
<a href="./index.html" class="on">Início</a><a href="./produto.html">Produto</a><a href="./carrinho.html">Carrinho</a><a href="./checkout.html">Checkout</a><a href="./pedidos.html">Pedidos</a><a href="./conta.html">Conta</a><a href="./admin.html">Admin</a>
</nav></div></header>
<main class="wrap">
<div class="hero">
<h1>A placa exata para a <em>sua TV</em></h1>
<p>Principal, Fonte e T-Con — compatibilidade garantida.</p>
<a class="btn" href="./produto.html"><i class="fa-solid fa-bolt"></i> Ver destaque</a>
</div>
<h2 style="margin-bottom:14px">Destaques</h2>
<div class="grid" id="grade"></div>
</main>
<footer>Protótipo navegável — PlacaCerta (demonstração)</footer>
<script>
const PRODS = [
  {id:'p1', nome:'Placa Principal LG 43" UJ6525', cat:'Principal', preco:189.90},
  {id:'p2', nome:'Placa Fonte Samsung 50" TU8000', cat:'Fonte', preco:149.90},
  {id:'p3', nome:'Placa T-Con Philco 32" PTV32', cat:'T-Con', preco:69.90},
  {id:'p4', nome:'Placa Principal TCL 55" P715', cat:'Principal', preco:219.90},
  {id:'p5', nome:'Placa Fonte AOC 43" S5295', cat:'Fonte', preco:129.90},
  {id:'p6', nome:'Placa T-Con Samsung 50" TU8000', cat:'T-Con', preco:89.90}
];
document.getElementById('grade').innerHTML = PRODS.map(p =>
  '<div class="card"><span class="badge">' + p.cat + '</span><h3 style="margin-top:8px">' + p.nome + '</h3>' +
  '<div class="price">R$ ' + p.preco.toFixed(2) + '</div>' +
  '<a class="btn btn-ghost" style="font-size:.8rem;padding:8px 16px" href="./produto.html?id=' + p.id + '">Ver produto</a></div>'
).join('');
</script>
</body>
</html>
