<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carrinho — Protótipo PlacaCerta</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root{--bg:#0a0e1a;--card:#131b36;--line:rgba(255,255,255,.09);--amber:#ffb224;--txt:#f2f5ff;--mut:#9aa4c7;--grad:linear-gradient(120deg,#ffb224,#ff8a00 55%,#ff5e3a);--r:18px}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--txt);font-family:Arial,Helvetica,sans-serif;min-height:100vh}
a{color:inherit;text-decoration:none}
.wrap{max-width:1200px;margin:0 auto;padding:0 24px}
.demo{background:var(--grad);color:#1a1000;font-size:.8rem;font-weight:700;text-align:center;padding:8px 16px}
header{position:sticky;top:0;z-index:50;background:rgba(10,14,26,.92);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;gap:20px;min-height:64px;flex-wrap:wrap;padding:8px 24px}
.brand{font-weight:700;font-size:1.25rem}
.brand em{font-style:normal;color:var(--amber)}
.nav-links{display:flex;gap:16px;flex-wrap:wrap;font-size:.88rem;color:var(--mut)}
.nav-links a:hover,.nav-links a.on{color:var(--amber)}
main{padding:36px 0 72px}
.box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:28px}
.item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.total{font-size:1.4rem;font-weight:700;color:var(--amber);margin:18px 0;text-align:right}
.btn{display:inline-flex;align-items:center;gap:8px;border:none;cursor:pointer;font-weight:700;font-size:.9rem;padding:12px 24px;border-radius:999px;background:var(--grad);color:#1a1000}
.btn-ghost{background:transparent;color:var(--txt);border:1px solid var(--line)}
footer{border-top:1px solid var(--line);padding:24px 0;color:var(--mut);font-size:.82rem;text-align:center}
</style>
</head>
<body>
<div class="demo"><i class="fa-solid fa-flask"></i>&nbsp; PROTÓTIPO — dados fictícios, sem login, sem backend</div>
<header><div class="wrap nav">
<a class="brand" href="./index.html">⚡ Placa<em>Certa</em></a>
<nav class="nav-links">
<a href="./index.html">Início</a><a href="./produto.html">Produto</a><a href="./carrinho.html" class="on">Carrinho</a><a href="./checkout.html">Checkout</a><a href="./pedidos.html">Pedidos</a><a href="./conta.html">Conta</a><a href="./admin.html">Admin</a>
</nav></div></header>
<main class="wrap">
<h1 style="margin-bottom:16px"><i class="fa-solid fa-cart-shopping" style="color:var(--amber)"></i> Meu Carrinho</h1>
<div class="box">
<div id="itens"></div>
<div class="total" id="total"></div>
<div style="display:flex;gap:10px;flex-wrap:wrap">
<a class="btn" href="./checkout.html"><i class="fa-solid fa-arrow-right"></i> Ir para o checkout</a>
<a class="btn btn-ghost" href="./index.html">Continuar comprando</a>
</div>
</div>
</main>
<footer>Protótipo navegável — PlacaCerta (demonstração)</footer>
<script>
const FALLBACK = [
  { nome: 'Placa Principal LG 43" UJ6525', qtd: 1, preco: 189.90 },
  { nome: 'Placa T-Con Philco 32" PTV32', qtd: 2, preco: 69.90 }
];
let itens = FALLBACK;
try {
  const salvo = JSON.parse(localStorage.getItem('proto_cart') || '[]');
  if (salvo.length) itens = salvo;
} catch (e) { /* demonstracao */ }
const total = itens.reduce((s, i) => s + i.qtd * i.preco, 0);
document.getElementById('itens').innerHTML = itens.map(i =>
  '<div class="item"><span>' + i.nome + ' <b>×' + i.qtd + '</b></span><b>R$ ' + (i.qtd * i.preco).toFixed(2) + '</b></div>'
).join('');
document.getElementById('total').textContent = 'Total: R$ ' + total.toFixed(2);
</script>
</body>
</html>
