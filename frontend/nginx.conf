# HTML sempre revalidado (sem cache travado entre deploys);
# JS/CSS/imagens seguem o padrao do nginx (ETag).
server {
    listen 80;
    listen [::]:80;
    root /usr/share/nginx/html;
    index index.html;

    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-store" always;
    }
}
