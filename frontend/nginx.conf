# HTML sempre revalidado (sem cache travado entre deploys);
# JS/CSS/imagens seguem o padrao do nginx (ETag).
server {
    listen 80;
    listen [::]:80;
    root /usr/share/nginx/html;
    index placas.html;

    location /prototipo/ {
        index index.html;
    }

    # Fotos de produtos (volume compartilhado, só leitura); imutáveis: cache longo
    location /fotos/ {
        expires 30d;
        add_header Cache-Control "public, immutable" always;
    }

    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-store" always;
    }
}
