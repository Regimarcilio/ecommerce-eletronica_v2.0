<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Carrinho | TechStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: #0a0a0f; color: #fff; }
        .navbar { background: rgba(10,10,15,0.95); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(67,97,238,0.3); padding: 15px 0; }
        .navbar-brand { font-size: 1.8rem; font-weight: 800; background: linear-gradient(135deg, #4361ee, #4cc9f0); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .btn-primary-custom { background: linear-gradient(135deg, #4361ee, #3a0ca3); border: none; padding: 12px 28px; border-radius: 50px; color: #fff; font-weight: 600; transition: all 0.3s; }
        .btn-primary-custom:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(67,97,238,0.4); }
        .cart-item { background: rgba(26,26,46,0.8); border-radius: 15px; padding: 20px; margin-bottom: 15px; border: 1px solid rgba(67,97,238,0.3); }
        .cart-item-image { width: 80px; height: 80px; background: #1a1a2e; border-radius: 10px; display: flex; align-items: center; justify-content: center; }
        .cart-item-image i { font-size: 2.5rem; color: #4361ee; }
        .quantity-input { width: 80px; padding: 5px 10px; background: #1a1a2e; border: 1px solid #4361ee; border-radius: 8px; color: #fff; text-align: center; }
        .summary-card { background: rgba(26,26,46,0.8); border-radius: 15px; padding: 25px; border: 1px solid rgba(67,97,238,0.3); position: sticky; top: 20px; }
        .btn-remove { background: transparent; border: none; color: #dc3545; cursor: pointer; transition: all 0.3s; }
        .btn-remove:hover { color: #ff6b6b; transform: scale(1.1); }
        .empty-cart { text-align: center; padding: 60px 20px; }
        .empty-cart i { font-size: 5rem; color: #4361ee; margin-bottom: 20px; }
        @media (max-width: 768px) { .cart-item { text-align: center; } .cart-item-image { margin: 0 auto 15px; } }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="/"><i class="bi bi-cpu"></i> TECHSTORE</a>
            <a href="/" class="btn btn-outline-light"><i class="bi bi-arrow-left"></i> Continuar Comprando</a>
        </div>
    </nav>

    <div class="container py-5">
        <h2 class="mb-4"><i class="bi bi-cart"></i> Meu Carrinho</h2>
        
        <div class="row">
            <div class="col-lg-8">
                <div id="cartItemsList"></div>
            </div>
            <div class="col-lg-4">
                <div class="summary-card">
                    <h4 class="mb-3">Resumo do Pedido</h4>
                    <div class="d-flex justify-content-between mb-2">
                        <span>Subtotal:</span>
                        <span id="subtotal">R$ 0,00</span>
                    </div>
                    <div class="d-flex justify-content-between mb-2">
                        <span>Frete:</span>
                        <span id="frete">Grátis</span>
                    </div>
                    <hr>
                    <div class="d-flex justify-content-between mb-3">
                        <strong>Total:</strong>
                        <strong id="total" style="color: #4361ee; font-size: 1.3rem;">R$ 0,00</strong>
                    </div>
                    <button class="btn btn-primary-custom w-100" onclick="finalizarCompra()">
                        <i class="bi bi-check-lg"></i> Finalizar Compra
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:5000/api';
        
        function getCart() {
            return JSON.parse(localStorage.getItem('cart') || '[]');
        }
        
        function saveCart(cart) {
            localStorage.setItem('cart', JSON.stringify(cart));
            renderCart();
        }
        
        function updateQuantity(productId, newQuantity) {
            let cart = getCart();
            const item = cart.find(i => i.id === productId);
            if (item && newQuantity > 0) {
                item.quantity = newQuantity;
                saveCart(cart);
            }
        }
        
        function removeFromCart(productId) {
            let cart = getCart();
            cart = cart.filter(i => i.id !== productId);
            saveCart(cart);
            showToast('Produto removido do carrinho!', 'danger');
        }
        
        function renderCart() {
            const cart = getCart();
            const container = document.getElementById('cartItemsList');
            const subtotalSpan = document.getElementById('subtotal');
            const totalSpan = document.getElementById('total');
            
            if (cart.length === 0) {
                container.innerHTML = `
                    <div class="empty-cart">
                        <i class="bi bi-cart-x"></i>
                        <h4>Seu carrinho está vazio</h4>
                        <p>Que tal dar uma olhada nos nossos produtos?</p>
                        <a href="/" class="btn btn-primary-custom">Explorar Produtos</a>
                    </div>
                `;
                subtotalSpan.innerText = 'R$ 0,00';
                totalSpan.innerText = 'R$ 0,00';
                return;
            }
            
            let subtotal = 0;
            container.innerHTML = '';
            
            cart.forEach(item => {
                subtotal += item.price * item.quantity;
                container.innerHTML += `
                    <div class="cart-item">
                        <div class="row align-items-center">
                            <div class="col-md-2 col-12 text-center">
                                <div class="cart-item-image mx-auto">
                                    <i class="bi bi-cpu"></i>
                                </div>
                            </div>
                            <div class="col-md-4 col-12">
                                <h5 class="mb-1">${item.name}</h5>
                                <small class="text-muted">SKU: ${item.sku || 'N/A'}</small>
                            </div>
                            <div class="col-md-2 col-12 text-center">
                                <p class="mb-0">R$ ${item.price.toFixed(2)}</p>
                            </div>
                            <div class="col-md-2 col-12 text-center">
                                <input type="number" class="quantity-input" value="${item.quantity}" min="1" 
                                       onchange="updateQuantity('${item.id}', this.value)">
                            </div>
                            <div class="col-md-2 col-12 text-end">
                                <button class="btn-remove" onclick="removeFromCart('${item.id}')">
                                    <i class="bi bi-trash fs-4"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            });
            
            const frete = subtotal > 100 ? 0 : 20;
            const total = subtotal + frete;
            
            subtotalSpan.innerText = `R$ ${subtotal.toFixed(2)}`;
            document.getElementById('frete').innerText = frete === 0 ? 'Grátis' : `R$ ${frete.toFixed(2)}`;
            totalSpan.innerText = `R$ ${total.toFixed(2)}`;
        }
        
        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `position-fixed bottom-0 end-0 m-3 alert alert-${type}`;
            toast.innerHTML = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
        
        function finalizarCompra() {
            const cart = getCart();
            if (cart.length === 0) {
                showToast('Seu carrinho está vazio!', 'danger');
                return;
            }
            
            // Salvar pedido no localStorage para o checkout
            localStorage.setItem('checkoutCart', JSON.stringify(cart));
            window.location.href = '/checkout.html';
        }
        
        renderCart();
    </script>
</body>
</html>
