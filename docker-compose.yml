services:
  mongodb:
    image: mongo:7
    container_name: ecommerce_mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-dev-troque-em-producao}
      MONGO_INITDB_DATABASE: ecommerce
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
  backend:
    build: ./backend
    container_name: ecommerce_backend
    restart: always
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      MONGODB_URI: mongodb://${MONGO_USER:-admin}:${MONGO_PASSWORD:-dev-troque-em-producao}@mongodb:27017/ecommerce?authSource=admin
      CORS_ORIGIN: http://localhost:8083
      E2E_NO_LIMIT: ${E2E_NO_LIMIT:-}
    ports:
      - "5010:5000"
    volumes:
      - fotos_data:/app/fotos
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
  frontend:
    build: ./frontend
    container_name: ecommerce_frontend
    restart: always
    ports:
      - "8083:80"
    volumes:
      - fotos_data:/usr/share/nginx/html/fotos:ro
    depends_on:
      backend:
        condition: service_healthy

  # Integracao WhatsApp (opcional): suba com --profile integracoes e pareie o QR
  evolution:
    image: atendai/evolution-api:v2.2.5
    container_name: ecommerce_evolution
    restart: unless-stopped
    profiles: ["integracoes"]
    ports:
      - "8080:8080"
    environment:
      AUTHENTICATION_TYPE: apikey
      AUTHENTICATION_API_KEY: ${EVO_APIKEY:-troque-esta-chave}
      DATABASE_ENABLED: "false"
    volumes:
      - evo_instances:/evolution/instances

volumes:
  mongo_data:
  evo_instances:
  fotos_data:
